      ${spells.length ? `<span class="label">Magias</span><div class="dlist">${spells.map(([n,s])=>`<button class="dbtn" data-act="cspell" data-n="${esc(n)}">${n} ×${s.left}</button>`).join("")}</div>` : ""}
      ${items.length ? `<span class="label">Itens</span><div class="dlist">${items.map(({it,i})=>`<button class="dbtn" data-act="citem" data-i="${i}">${esc(/^Pergaminho Mágico \(/.test(it.n) ? "Pergaminho: " + it.n.match(/\((.+)\)/)[1] : it.n.split(" (")[0])}</button>`).join("")}</div>` : ""}
      <p class="muted small">Magias e itens gastam o seu turno de ataque.</p></div>`;
  } else if(c.phase === "alloc"){
    const p = c.pending, absorbable = p.total;
    const slots = ARMOR_SLOTS.filter(s=>h.armor[s] && armorCur(h.armor[s])>0);
    const used = slots.reduce((a,s)=>a+(c.alloc[s]||0),0);
    const toPV = absorbable - used + p.poison;
    panel = `<div class="stack">
      <p><b>Os monstros causam ${N(p.total + p.poison)} de dano.</b>${p.poison ? ` ${N(p.poison)} é veneno e vai direto nos PV.` : ""} Distribua o resto entre a armadura e seus PV.</p>
      ${slots.map(s=>{ const pc = h.armor[s], a = c.alloc[s]||0, max = Math.min(armorCur(pc), absorbable - used + a);
        return `<div class="alloc"><div class="txt"><b>${s}</b><span class="small">${esc(pc.n.split(" (")[0])} · ${N(armorCur(pc)-a)}/${N(pc.pv)} PV</span></div>
          <button class="mini" data-act="alloc" data-s="${s}" data-d="-1" ${a<=0?"disabled":""} aria-label="Menos dano em ${s}">−</button>
          <span class="n big2">${a}</span>
          <button class="mini" data-act="alloc" data-s="${s}" data-d="1" ${a>=max?"disabled":""} aria-label="Mais dano em ${s}">+</button></div>`; }).join("")}
      <div class="alloc"><div class="txt"><b>Seus PV</b><span class="small">${N(Math.max(0,h.pv - toPV))}/${N(h.pvMax)} depois do golpe</span></div><span class="n big2">${toPV}</span></div>
      <div class="row"><button class="btn ghost" data-act="allocAll">Tudo na armadura</button><button class="btn ghost" data-act="allocNone">Tudo nos PV</button></div>
      <button class="btn" data-act="allocOk">Receber o golpe</button></div>`;
  } else if(c.phase === "won"){
    panel = `<div class="banner"><b>Vitória!</b><p>Os monstros caíram. Recolha os espólios e siga explorando.</p><button class="btn" data-act="win">Continuar</button></div>`;
  } else {
    panel = `<p class="small muted">Turno dos monstros...</p>`;
  }
  return `
  <div class="bar"><h2>Combate <span class="label">Turno ${N(c.round)}</span></h2></div>
  <canvas id="arena" class="arena" width="192" height="128" data-anim="arena" aria-label="Arena de combate"></canvas>
  <div class="etray" id="etray"></div>
  <div class="strip"><span>PV<b>${h.pv}/${h.pvMax}</b></span><span>Fúria<b>${c.fury?"+"+c.fury:"-"}</b></span><span>Paralisia<b>${c.heroPar||"-"}</b></span></div>
  <div class="hp" aria-hidden="true"><i style="width:${pct}%"></i></div>
  ${armor ? `<div class="stats">${armor}</div>` : ""}
  <div class="tgts">${units}</div>
  <div class="sheet">${panel}</div>
  <div class="sheet"><h3>Combate</h3><div class="log">${c.log.slice(0,8).map(l=>`<p>${esc(l)}</p>`).join("")}</div></div>`;
}

/* ajustes */
function viewSettings(){
  const st = state.settings;
  const opt = (on, act, v, title, desc, dis) => `<button class="opt ${on?"on":""}" data-act="${act}" data-v="${v}" ${dis?"disabled":""}><b>${title}</b><span>${desc}</span></button>`;
  return `
  ${bar("Ajustes")}
  <div class="sheet"><h3>Visual</h3>
    ${opt(st.skin==="zelda","setSkin","zelda","Masmorra","Colorido, com paredes em perspectiva e luz de tocha, inspirado nos clássicos de 16 bits")}
    ${opt(st.skin==="bw","setSkin","bw","Caderno","Preto e branco, como papel e caneta")}
  </div>
  <div class="sheet"><h3>Mochila</h3>
    <label class="label" for="bagCap">Limite da Mochila</label>
    <input type="range" id="bagCap" min="0" max="2" step="1" value="${[10,20,0].indexOf(st.bagCap)}" aria-valuetext="${st.bagCap?st.bagCap+" itens":"Sem limite"}">
    <div class="ticks">${["10 itens","20 itens","Sem limite"].map((t,i)=>`<span class="${[10,20,0][i]===st.bagCap?"on":""}">${t}</span>`).join("")}</div>
    <p class="muted small">${st.bagCap===10 ? "Regra do livro." : st.bagCap===20 ? "O dobro da regra do livro." : "Carregue quantos itens quiser."}</p>
  </div>
  <div class="sheet"><h3>Mapa</h3>
    ${opt(true,"noop","","Automático","O jogo rola, desenha e encaixa cada segmento")}
    ${opt(false,"noop","","Manual","Em breve: escolha 1 de 3 desenhos e arraste para encaixar no mapa",true)}
  </div>
  <div class="sheet"><h3>Som e vibração</h3><p class="muted small">Em breve.</p></div>`;
}

/* cemitério */
function viewCemetery(){
  const list = state.cemetery.slice().reverse();
  const ld = state.ui.lastDeath;
  return `
  ${bar("Cemitério")}
  ${ld ? `<div class="banner"><b>${esc(ld.name)} morreu.</b><p>${esc(ld.cause)}. Crie um novo aventureiro para recuperar a mochila na masmorra.</p><button class="btn" data-act="newHero">Novo aventureiro</button></div>` : ""}
  <p class="muted">Os personagens que morreram tentando explorar estas masmorras.</p>
  <div class="sheet">
    ${list.length ? list.map((g,k)=>{ const i = state.cemetery.length-1-k; return `
      <div class="grave"><canvas width="12" height="15" data-grave></canvas>
        <div><b>${esc(g.name)}</b><span class="small">${esc(g.who)}</span><br>
        <span class="small muted">${esc(g.where||"Fora das masmorras")}</span><br>
        <span class="small">${esc(g.cause||"Causa desconhecida")}</span>
        ${state.ui.delGrave===i ? `<div class="sheet dashed" style="margin-top:8px;padding:10px"><p class="small">Apagar ${esc(g.name)} do cemitério para sempre?</p>
          <div class="row"><button class="btn ghost" data-act="cancelDelGrave">Cancelar</button><button class="btn" data-act="delGrave" data-i="${i}">Apagar</button></div></div>` : ""}</div>
        <button class="xbox" data-act="askDelGrave" data-i="${i}" aria-label="Apagar ${esc(g.name)}">×</button></div>`; }).join("")
      : `<p class="muted">Nenhuma lápide ainda. Por enquanto.</p>`}
  </div>`;
}

/* backup */
function viewSave(){
  const code = encodeSave();
  return `
  ${bar("Backup")}
  <div class="sheet">
    <h3>Save automático</h3>
    <p>O jogo salva sozinho neste aparelho a cada ação. No iPhone, deixe o jogo instalado na tela de início para o Safari não apagar o progresso.</p>
  </div>
  <div class="sheet">
    <h3>Exportar</h3>
    <p class="small">Copie o código abaixo e guarde onde quiser (Notas, Drive, WhatsApp). Ele leva aventureiro, cemitério e masmorra.</p>
    <textarea id="exportCode" readonly>${code}</textarea>
    <button class="btn" data-act="copy">Copiar código</button>
  </div>
  <div class="sheet">
    <h3>Importar</h3>
    <p class="small">Cole um código salvo. Isso substitui o jogo atual deste aparelho.</p>
    <textarea id="importCode" placeholder="NQ1:..."></textarea>
    <button class="btn ghost" data-act="import">Restaurar este save</button>
  </div>
  <p class="toast" id="toast">${esc(toastMsg)}</p>`;
}

/* =========================================================
   RENDER E AÇÕES
   ========================================================= */
const VIEWS = {combat:viewCombat, settings:viewSettings, title:viewTitle, create:viewCreate, sheet:viewSheet, dungeon:viewDungeon, explore:viewExplore, city:viewCity, cemetery:viewCemetery, save:viewSave};
function render(){
  if(state.screen==="create" && !state.draft) state.screen = "title";
  if(["sheet","dungeon","explore","city"].includes(state.screen) && !state.hero) state.screen = "title";
  if(state.screen==="explore" && !(state.dungeon && state.dungeon.inside)) state.screen = "sheet";
  if(state.screen==="combat" && !(state.combat && state.hero)) state.screen = state.hero && state.dungeon && state.dungeon.inside ? "explore" : "title";
  $("#app").innerHTML = (VIEWS[state.screen]||viewTitle)();
  const dr = state.draft;
  if(state.screen==="create" && dr){
    const tray = $("#tray");
    if(tray){
      if(dr.step==="race") fillTray(tray, dr.raceDice, true);
      else if(dr.step==="cls") fillTray(tray, dr.clsDice, true);
      else if(dr.step==="spells") fillTray(tray, dr.spells.length ? [dr.spells[dr.spells.length-1]] : null, false);
    }
  }
  if(state.screen==="dungeon" && state.dungeon){
    state.dungeon.dice.forEach((v,i)=>fillTray($("#t"+i),[v],false));
  }
  if(state.screen==="explore"){
    const tray = $("#etray");
    rollLog.forEach(r=>{
      const g = document.createElement("div"); g.className = "rg";
      g.innerHTML = `<div class="dice"></div><span class="label">${esc(r.label)}</span>`;
      r.vals.forEach(v=>g.querySelector(".dice").appendChild(dieCanvas(v)));
      tray.appendChild(g);
    });
    const cv = $("#map"); if(cv) bindMap(cv);
  }
  if(state.screen==="combat"){ const a = $("#arena"); if(a) a.addEventListener("click", arenaTap); }
  document.querySelectorAll("canvas[data-grave]").forEach(drawGrave);
  document.querySelectorAll("canvas[data-gear]").forEach(drawGear);
  document.querySelectorAll("canvas[data-clip]").forEach(drawClip);
  paint();
}

const actions = {
  go(b){ const keep = state.ui.lastDeath && b.dataset.to==="cemetery"; state.ui = keep ? state.ui : {}; go(b.dataset.to); },
  newHero(){
    if(state.hero){ state.ui.confirmNew = true; render(); return; }
    startDraft();
  },
  cancelNew(){ state.ui = {}; render(); },
  abandon(){
    const h = state.hero, d = state.dungeon;
    state.cemetery.push({name:h.name, who:`${RACES[h.race].n} ${CLASSES[h.cls].n}`, where:d&&d.name, cause:"Abandonado pelo jogador"});
    if(d && d.inside){ d.corpses.push({level:d.pos.level, seg:d.pos.seg, name:h.name, bag:h.bag, coins:h.coins}); d.inside = false; }
    state.hero = null; state.ui = {};
    startDraft();
  },
  async rollRace(){
    busy = true; lockButtons();
    const v = await rollInto($("#tray"), 2);
    state.draft.raceDice = v; state.draft.race = v[0]+v[1]; state.draft.spells = [];
    busy = false; persist(); render();
  },
  async rollCls(){
    busy = true; lockButtons();
    const v = await rollInto($("#tray"), 2);
    state.draft.clsDice = v; state.draft.cls = v[0]+v[1]; state.draft.spells = [];
    busy = false; persist(); render();
  },
  afterCls(){ state.draft.step = needSpells(state.draft) ? "spells" : "name"; persist(); render(); },
  step(b){ state.draft.step = b.dataset.to; persist(); render(); },
  async rollSpell(){
    busy = true; lockButtons();
    const [v] = await rollInto($("#tray"), 1);
    state.draft.spells.push(v);
    busy = false; persist(); render();
  },
  randName(){
    const inp = $("#heroName");
    let n; do{ n = pick(HERO_NAMES); } while(n===inp.value);
    inp.value = n; state.draft.name = n; persist();
  },
  finish(){
    const dr = state.draft, inp = $("#heroName");
    const name = (inp.value||"").trim() || pick(HERO_NAMES);
    const r = RACES[dr.race], c = CLASSES[dr.cls];
    const spells = {};
    Object.entries(buildSpells(dr)).forEach(([n,q])=>spells[n] = {max:q, left:q});
    state.hero = {name, race:dr.race, cls:dr.cls, pvMax:r.pv+c.pv, pv:r.pv+c.pv, torches:10, coins:0,
      weapon:{n:c.w, d:c.d}, armor:{}, bag:[], spells};
    state.draft = null; state.ui = {};
    go(state.dungeon && !state.dungeon.complete ? "dungeon" : "sheet");
  },
  pv(b){ const h = state.hero; h.pv = Math.max(0, Math.min(h.pvMax, h.pv + +b.dataset.d)); persist(); render(); },
  torch(b){ const h = state.hero; h.torches = Math.max(0, Math.min(10, h.torches + +b.dataset.d)); persist(); render(); },
  coin(b){ const h = state.hero; h.coins = Math.max(0, h.coins + +b.dataset.d); persist(); render(); },
  cast(b){
    const h = state.hero, n = b.dataset.spell, s = h.spells[n];
    if(!s || s.left<=0) return;
    s.left--;
    if(n==="Cura") h.pv = Math.min(h.pvMax, h.pv+5);
    if(n==="Luz") h.torches = Math.min(10, h.torches+1);
    if(state.dungeon && state.dungeon.inside) log(`Você usou ${n}.`);
    persist(); render();
  },
  bagSel(b){ const i = +b.dataset.i; state.ui.bagSel = state.ui.bagSel===i ? null : i; render(); },
  equip(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    const old = h.armor[it.slot];
    h.armor[it.slot] = it; h.bag.splice(i,1);
    if(old) h.bag.push(old);
    state.ui.bagSel = null; persist(); render();
  },
  wield(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    const old = h.weapon;
    h.weapon = {n:it.n, d:it.d, two:it.two, magic:it.magic};
    h.bag.splice(i,1);
    if(old && !old.unarmed) h.bag.push({n:old.n, weapon:true, d:old.d, two:old.two, magic:old.magic});
    state.ui.bagSel = null; persist(); render();
  },
  useItem(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    if(/^Poção de Vida/.test(it.n)) h.pv = h.pvMax;
    if(/^Poção de Magia/.test(it.n)) Object.values(h.spells).forEach(s=>s.left=s.max);
    if(/^Poção da Luminescência/.test(it.n)) h.torches = Math.min(10, h.torches+2);
    if(/^Poção da Salamandra|^Poção Mão na Roda/.test(it.n)) h.arms = 2;
    if(/^Safira da Magia/.test(it.n)){ const s = SPELLS[d6()].n; h.spells[s] = h.spells[s] ? {max:h.spells[s].max+1, left:h.spells[s].left+1} : {max:1,left:1}; }
    h.bag.splice(i,1);
    if(state.dungeon && state.dungeon.inside) log(`Você usou ${it.n.split(" (")[0]}.`);
    state.ui.bagSel = null; persist(); render();
  },
  drop(b){ const h = state.hero; h.bag.splice(+b.dataset.i,1); state.ui.bagSel = null; persist(); render(); },

  async rollDungeon(){
    busy = true; lockButtons();
    if(!$("#t0")){ busy=false; return; }
    const r = await Promise.all([rollInto($("#t0"),1), rollInto($("#t1"),1), rollInto($("#t2"),1)]);
    const [a,bb,c] = r.map(x=>x[0]);
    state.dungeon = newDungeonRecord(a, dungeonName(a,bb,c), [a,bb,c]);
    state.ui = {};
    busy = false; persist(); render();
  },
  askReroll(){ state.ui.confirmReroll = true; render(); },
  cancelReroll(){ state.ui = {}; render(); },
  enter(){
    const d = state.dungeon, h = state.hero;
    if(!d.levels[1]){ buildLevel1(); log(`Você entrou n${d.name.startsWith("A ")?"a":"o"} ${d.name.slice(2)}.`); }
    else {
      d.pos = {level:1, seg:Object.values(d.levels[1].segs).find(s=>s.exit).id};
      Object.values(d.levels).forEach(lv=>Object.values(lv.segs).forEach(s=>{ if(s.mon) [s.mon,...(s.mon.extra||[])].forEach(g=>g.list.forEach(m=>m.pv=m.max)); }));
      log("Você voltou para a masmorra. Monstros que ficaram aqui recuperaram todos os PV, e as salas vazias podem ter novos ocupantes.");
    }
    d.visits++;
    d.inside = true;
    Object.values(d.levels).forEach(lv=>Object.values(lv.segs).forEach(s=>{ if(d.visits===1) s.ret = 1; }));
    state.ui = {}; rollLog = []; centerOn = true; mapVersion++;
    go("explore");
  },
  selDoor(b){ state.ui.selDoor = b.dataset.id; render(); },
  openDoor(b){ doOpenDoor(b.dataset.id); },
  unlock(b){ doUnlock(b.dataset.id, b.dataset.how); },
  loot(){ collectLoot(curSeg()); mapVersion++; persist(); render(); },
  chest(){ doChest(); },
  secret(){ doSecret(); },
  disarm(){ doDisarm(); },
  sneak(){ doSneak(); },
  defeat(){ doDefeat(); },
  descend(){ doDescend(); },
  climb(){ doClimb(); },
  corpse(){ doCorpse(); },
  lastFinal(){ const lv = LV(); const s = lv.segs[lv.last]; moveTo(s.id); doBoss(s); },
  leave(){ leaveDungeon(); state.ui = {}; persist(); render(); window.scrollTo(0,0); },
  zoom(b){ cam.z = clampZ(cam.z * +b.dataset.z); },
  center(){ centerOn = true; },
  noop(){},
  eqSel(b){ state.ui.eqSel = state.ui.eqSel === b.dataset.s ? null : b.dataset.s; state.ui.bagSel = null; render(); },
  unequip(b){
    const h = state.hero, s = b.dataset.s;
    if(h.bag.length >= bagMax()) return;
    if(s === "weapon"){ const w = h.weapon; h.bag.push({n:w.n, weapon:true, d:w.d, two:w.two, magic:w.magic}); h.weapon = {n:"Mãos nuas", d:"1d6-3", unarmed:true}; }
    else { h.bag.push(h.armor[s]); delete h.armor[s]; }
    state.ui.eqSel = null; persist(); render();
  },
  repairOne(b){
    const h = state.hero, p = h.armor[b.dataset.s]; if(!p) return;
    if(b.dataset.how === "coin"){ if(h.coins<1) return; h.coins--; }
    else { if(h.torches<1) return; if(state.dungeon && state.dungeon.inside){ if(!spendTorch(1, "Consertando a armadura")){ persist(); render(); return; } } else h.torches--; }
    p.cur = p.pv;
    if(state.dungeon && state.dungeon.inside) log(`Você consertou ${p.n.split(" (")[0]}.`);
    persist(); render();
  },
  fight(b){ startCombat(b.dataset.surprise === "1"); },
  target(b){ C().sel = +b.dataset.i; persist(); render(); },
  attack(){ heroAttack("weapon"); },
  horn(){ heroAttack("horn"); },
  cspell(b){ heroSpell(b.dataset.n); },
  citem(b){ heroItem(+b.dataset.i); },
  alloc(b){ const c = C(); const s = b.dataset.s; c.alloc[s] = Math.max(0, (c.alloc[s]||0) + +b.dataset.d); render(); },
  allocAll(){ const c = C(), h = state.hero; let left = c.pending.total; c.alloc = {};
    ARMOR_SLOTS.filter(s=>h.armor[s] && armorCur(h.armor[s])>0).sort((a,b)=>armorCur(h.armor[b])-armorCur(h.armor[a])).forEach(s=>{ const a = Math.min(left, armorCur(h.armor[s])); if(a){ c.alloc[s] = a; left -= a; } }); render(); },
  allocNone(){ C().alloc = {}; render(); },
  allocOk(){ const c = C(); applyHeroDamage(c.alloc, c.pending.total, c.pending.poison); },
  win(){ winCombat(); },
  takeStash(){ takeStash(); persist(); render(); },
  later(){ state.ui.bagFull = false; log("Você deixou os itens aqui para pegar depois."); persist(); render(); },
  startPick(){
    const h = state.hero, seg = curSeg(), p = {};
    h.bag.forEach((_,i)=>p["b"+i] = true);
    let free = bagMax() - h.bag.length;
    seg.stash.forEach((_,i)=>{ p["s"+i] = free > 0; if(free>0) free--; });
    state.ui.pick = p; render();
  },
  togglePick(b){ state.ui.pick[b.dataset.k] = !state.ui.pick[b.dataset.k]; render(); },
  cancelPick(){ state.ui.pick = null; render(); },
  confirmPick(){
    const h = state.hero, seg = curSeg(), p = state.ui.pick;
    const keep = [], gone = [];
    h.bag.forEach((it,i)=>(p["b"+i] ? keep : gone).push(it));
    seg.stash.forEach((it,i)=>(p["s"+i] ? keep : gone).push(it));
    if(keep.length > bagMax()) return;
    h.bag = keep; seg.stash = [];
    state.ui.pick = null; state.ui.bagFull = false;
    log(gone.length ? `Você organizou a mochila e descartou: ${gone.map(it=>it.n.split(" (")[0]).join("; ")}.` : "Você organizou a mochila.");
    mapVersion++; persist(); render();
  },
  askDelGrave(b){ state.ui.delGrave = +b.dataset.i; render(); },
  cancelDelGrave(){ state.ui.delGrave = null; render(); },
  delGrave(b){ state.cemetery.splice(+b.dataset.i, 1); state.ui.delGrave = null; persist(); render(); },
  setSkin(b){
    const was = isZ();
    state.settings.skin = b.dataset.v;
    applySkin();
    if(was !== isZ()) cam.z = isZ() ? cam.z/4 : cam.z*4;
    cam.z = clampZ(cam.z); centerOn = true;
    persist(); render();
  },


  rest(){
    const h = state.hero; if(h.coins<1) return;
    h.coins--; h.pv = h.pvMax; Object.values(h.spells).forEach(s=>s.left=s.max);
    ARMOR_SLOTS.forEach(s=>{ if(h.armor[s]) h.armor[s].cur = h.armor[s].pv; });
    state.ui.cityMsg = "Você descansou. PV e magias recuperados.";
    persist(); render();
  },
  buyTorch(){ const h = state.hero; if(h.coins<1||h.torches>=10) return; h.coins--; h.torches++; state.ui.cityMsg = "Você comprou 1 tocha."; persist(); render(); },
  repair(){ const h = state.hero; if(h.coins<1) return; const s = ARMOR_SLOTS.find(s=>h.armor[s] && h.armor[s].cur < h.armor[s].pv); if(!s) return; h.coins--; h.armor[s].cur = h.armor[s].pv; state.ui.cityMsg = `${s} consertado.`; persist(); render(); },
  sell(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    const v = sellValue(it);
    h.coins += v; h.bag.splice(i,1);
    state.ui.cityMsg = `Você vendeu ${it.n.split(" (")[0]} por ${v} moeda${v===1?"":"s"}.`;
    persist(); render();
  },

  askDeath(){ state.ui.confirmDeath = true; render(); setTimeout(()=>{ const i=$("#deathCause"); if(i) i.focus(); },30); },
  cancelDeath(){ state.ui = {}; render(); },
  die(){
    const cause = ($("#deathCause").value||"").trim() || "Causa desconhecida";
    killHero(cause);
    persist(); render(); window.scrollTo(0,0);
  },
  copy(){
    const ta = $("#exportCode");
    const ok = () => { toastMsg = "Código copiado."; $("#toast").textContent = toastMsg; };
    const fallback = () => { ta.focus(); ta.select(); toastMsg = "Código selecionado. Toque em Copiar no menu do iPhone."; $("#toast").textContent = toastMsg; };
    try{ navigator.clipboard.writeText(ta.value).then(ok, fallback); }catch(e){ fallback(); }
  },
  import(){
    const code = $("#importCode").value;
    if(!code.trim()){ toastMsg = "Cole um código antes de restaurar."; $("#toast").textContent = toastMsg; return; }
    try{
      const s = decodeSave(code);
      state = {...freshState(), ...s, screen:"title", ui:{}};
      migrate(); applySkin(); persist(); toastMsg = ""; mapVersion++; render();
    }catch(e){
      toastMsg = "Esse código não é um save do NoteQuest. Confira se copiou ele inteiro, começando por NQ1:";
      $("#toast").textContent = toastMsg;
    }
  }
};
function startDraft(){
  state.draft = {step:"race", race:null, cls:null, raceDice:null, clsDice:null, spells:[], name:""};
  state.ui = {};
  go("create");
}
function lockButtons(){ document.querySelectorAll("#app button").forEach(b=>b.disabled = true); }

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(!b || busy || b.disabled) return;
  const fn = actions[b.dataset.act];
  if(fn) fn(b);
});
document.addEventListener("change", e=>{
  if(e.target.id==="bagCap"){ state.settings.bagCap = [10,20,0][+e.target.value]; persist(); render(); }
});
document.addEventListener("input", e=>{
  if(e.target.id==="bagCap"){ const v = [10,20,0][+e.target.value]; state.settings.bagCap = v; persist();
    document.querySelectorAll(".ticks span").forEach((sp,i)=>sp.classList.toggle("on", i===+e.target.value)); }
  if(e.target.id==="heroName" && state.draft){ state.draft.name = e.target.value; persist(); }
});

function paint(){
  document.querySelectorAll("canvas[data-anim]").forEach(cv=>{
    const a = cv.dataset.anim;
    if(a==="scene") drawScene(cv);
    if(a==="torches") drawTorches(cv);
    if(a==="map") drawMap(cv);
    if(a==="arena") drawArena(cv);
  });
  document.querySelectorAll("canvas[data-mon]").forEach(cv=>{
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#0c0a12"; ctx.fillRect(0,0,48,40);
    const P = state.dungeon ? palZ() : PALZ[6];
    for(let y=6;y<40;y++) for(let x=0;x<48;x++){ const h = zh(x,y); ctx.fillStyle = (x%32===0||y===6) ? P.F[0] : h<.14 ? P.F[1] : h>.86 ? P.F[3] : P.F[2]; ctx.fillRect(x,y,1,1); }
    if(cv.dataset.boss==="1"){ const g = ctx.createRadialGradient(24,26,2,24,26,20); g.addColorStop(0,"rgba(255,80,60,.22)"); g.addColorStop(1,"rgba(255,80,60,0)"); ctx.fillStyle = g; ctx.fillRect(0,0,48,40); }
    drawMonsterSprite(ctx, cv.dataset.mon, 24, 35, frame/8, frame);
  });
}
let last = 0;
function loop(ts){
  if(ts - last > 120){ last = ts; frame++; paint(); }
  else { const m = $("#map"); if(m) drawMap(m); const ar = $("#arena"); if(ar && fxPops.length) drawArena(ar); }
  requestAnimationFrame(loop);
}

function start(data){
  state = (data && data.state) ? data.state : loadState();
  migrate();
  applySkin();
  cam.z = isZ() ? .85 : 3;
  render();
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({state}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
