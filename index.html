<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NoteQuest</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoteQuest">
<meta name="theme-color" content="#18213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: caderno quadriculado em coluna única, uma tela de app por vez, tinta preta sobre papel */
:root{
  --paper:#fbfbf6;
  --grid:#e6e6de;
  --ink:#141412;
  --ink-soft:#5b5b55;
  --wash:#efefe7;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"VT323","Courier New",monospace;
  --num:"Press Start 2P","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:18px 18px;
  color:var(--ink);
  font-family:var(--body);
  font-size:21px;
  line-height:1.2;
  -webkit-tap-highlight-color:transparent;
}
#app{
  max-width:480px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(14px,calc(env(safe-area-inset-top,0px) + 6px));
  padding-bottom:max(40px,calc(env(safe-area-inset-bottom,0px) + 24px));
  display:flex;flex-direction:column;gap:16px;
}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700}
h2{font-size:26px;letter-spacing:.02em}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
p{margin:0}
.muted{color:var(--ink-soft)}
.small{font-size:18px}
.n{font-family:var(--num);font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums}

.bar{display:flex;align-items:center;gap:12px;min-height:44px}
.bar h2{flex:1;min-width:0}
.bar h2.sm{font-size:18px;line-height:1.1}
.back{
  font-family:var(--display);font-size:16px;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);padding:6px 10px;cursor:pointer;min-height:44px;min-width:44px
}

.btn{
  font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.03em;
  background:var(--ink);color:var(--paper);border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink-soft);
  padding:10px 14px;min-height:50px;width:100%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;
  transition:transform .06s,box-shadow .06s;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink-soft)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn small{font-family:var(--body);font-size:17px;font-weight:400;opacity:.85}
.btn:focus-visible,.back:focus-visible,.mini:focus-visible,input:focus-visible,textarea:focus-visible,.dbtn:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.row{display:flex;gap:12px}
.row > *{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.mini{
  font-family:var(--display);font-weight:700;font-size:20px;
  width:44px;height:44px;flex:none;border:3px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer
}
.mini:active{background:var(--ink);color:var(--paper)}

.sheet{background:var(--paper);border:3px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px}
.sheet.dashed{border-style:dashed}
.label{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft)}

.scene{width:100%;border:3px solid var(--ink);background:var(--paper)}
.logo{text-align:center;display:flex;flex-direction:column;gap:4px;margin-top:-4px}
.logo h1{font-size:46px;letter-spacing:.04em;line-height:1}
.logo p{font-size:20px}
.credit{font-size:17px;text-align:center;color:var(--ink-soft);margin-top:auto;padding-top:8px}

.tray{display:flex;gap:12px;justify-content:center;min-height:62px;align-items:center;flex-wrap:wrap}
.tray canvas{width:58px;height:58px}
.tray .sum{font-family:var(--num);font-size:20px;margin-left:6px}
.tray .hint{font-size:19px;color:var(--ink-soft)}

.steps{display:flex;gap:6px}
.steps span{flex:1;height:8px;border:2px solid var(--ink)}
.steps span.on{background:var(--ink)}
.result{display:flex;flex-direction:column;gap:6px}
.result .name{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-size:14px;font-weight:600;border:2px solid var(--ink);padding:3px 8px;letter-spacing:.04em}
.chip.solid{background:var(--ink);color:var(--paper)}

input[type=text],textarea{
  font-family:var(--body);font-size:22px;color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);padding:10px;width:100%;border-radius:0;
}
textarea{font-size:16px;font-family:ui-monospace,monospace;min-height:110px;resize:vertical;word-break:break-all}

.hero-head{display:flex;flex-direction:column;gap:4px}
.hero-head .name{font-family:var(--display);font-size:32px;font-weight:700;line-height:1;overflow-wrap:anywhere}
.counter{display:flex;align-items:center;gap:10px}
.counter .big{font-family:var(--num);font-size:22px;flex:1;text-align:center}
.counter .big small{font-size:12px;color:var(--ink-soft)}
.hp{height:16px;border:3px solid var(--ink);position:relative;background:
  repeating-linear-gradient(45deg,var(--paper) 0 3px,var(--wash) 3px 6px)}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.torch-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.torch-wrap canvas{width:100%;max-width:300px;height:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{border:2px dashed var(--ink-soft);padding:6px 8px;font-size:18px;min-height:40px;display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.slot b{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.slot.full{border-style:solid;border-color:var(--ink)}
.eqbtn{text-align:left;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;cursor:pointer;width:100%}
.eqbtn.sel{background:var(--ink);color:var(--paper)}
.item{border:2px solid var(--ink);padding:8px 10px;font-size:19px;background:var(--paper);cursor:pointer;text-align:left;color:var(--ink);font-family:var(--body);width:100%}
.item.sel{background:var(--ink);color:var(--paper)}
.item-acts{display:flex;gap:8px;flex-wrap:wrap}
.item-acts .use{flex:1}
.bagtools{display:flex;gap:2px;align-items:center;flex:none}
.bagtools .sortb{margin-left:3px}
.bagtools .use{border-width:2px;padding:3px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;line-height:0}
.bagtools .use.on{background:var(--ink);color:var(--paper)}
.spell{display:flex;align-items:center;gap:10px;border-bottom:2px dotted var(--ink-soft);padding-block:6px}
.spell:last-child{border-bottom:0}
.spell .txt{flex:1;min-width:0}
.spell .txt b{font-family:var(--display);font-size:16px;font-weight:700;display:block}
.pips{display:flex;gap:4px;margin-top:3px}
.pips i{width:12px;height:12px;border:2px solid var(--ink)}
.pips i.on{background:var(--ink)}
.use{font-family:var(--display);font-size:14px;font-weight:600;border:3px solid var(--ink);background:var(--paper);color:var(--ink);padding:6px 10px;min-height:44px;cursor:pointer}
.use:active{background:var(--ink);color:var(--paper)}
.use:disabled{opacity:.35}
.adv{border-left:4px solid var(--ink);padding-left:10px}

.dname{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.08;text-align:center;text-wrap:balance}
.intro{font-size:21px;line-height:1.25}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tri canvas{width:52px;height:52px;margin:0 auto}
.tri .label{font-size:11px}

.grave{display:flex;gap:12px;align-items:flex-start;border-bottom:2px dotted var(--ink-soft);padding-block:8px}
.grave:last-child{border-bottom:0}
.grave canvas{width:36px;height:44px;flex:none}
.grave div{min-width:0;flex:1}
.grave b{font-family:var(--display);font-size:18px;display:block;overflow-wrap:anywhere}
.xbox{flex:none;width:30px;height:30px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--display);font-size:18px;font-weight:700;line-height:1;cursor:pointer;padding:0;align-self:flex-start;position:relative}
.xbox::after{content:"";position:absolute;inset:-8px}
.xbox:active{background:var(--ink);color:var(--paper)}
.grave .btn{font-size:15px;padding:8px 6px;min-height:44px}

.racecats{display:flex;flex-wrap:wrap;gap:8px}
.rcat{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;padding:7px 10px;cursor:pointer}
.rcat i{width:14px;height:14px;border:2px solid currentColor;display:inline-block;flex:none}
.rcat.on{background:var(--ink);color:var(--paper)}
.rcat.on i{background:currentColor;box-shadow:inset 0 0 0 2px var(--ink)}
.soon{font-family:var(--display);font-size:12px;letter-spacing:.06em;border:1px dashed currentColor;padding:1px 5px;white-space:nowrap;opacity:.8}
.advc{border-top:2px dotted var(--ink-soft);padding:10px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.advc:first-of-type{border-top:0}
.advc .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.advfold summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.advfold summary::-webkit-details-marker{display:none}
.advfold summary::after{content:"+";font-family:var(--display);font-size:22px}
.advfold[open] summary::after{content:"−"}
.hist{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:18px}
.hist b{font-family:var(--display);font-weight:600}
.note{font-size:19px;border:2px dashed var(--ink);padding:10px;background:var(--paper)}
.toast{font-family:var(--display);font-size:15px;text-align:center;min-height:20px}

/* exploração */
.strip{display:flex;gap:8px;justify-content:space-between;border:3px solid var(--ink);background:var(--paper);padding:8px 10px}
.strip span{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;gap:4px}
.strip b{font-family:var(--num);font-size:14px;font-weight:400;letter-spacing:0}
.mapbox{position:relative;border:3px solid var(--ink);background:var(--paper);height:clamp(280px,48vh,460px);touch-action:none;overflow:hidden}
.mapbox canvas{width:100%;height:100%}
.mapctl{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border:3px solid var(--ink);background:var(--paper);font-family:var(--display);font-size:20px;font-weight:700;cursor:pointer;color:var(--ink)}
.mapctl button canvas{width:22px;height:22px;display:block;margin:auto}
.mapctl button:active{background:var(--ink);color:var(--paper)}
.doorpop{position:absolute;left:0;top:0;display:flex;flex-wrap:wrap;max-width:260px;gap:6px;z-index:2;pointer-events:auto}
.pbtn{font-family:var(--body);font-size:17px;border:3px solid var(--ink);background:#e9dcb4;color:#18213d;padding:4px 10px;min-height:40px;cursor:pointer;box-shadow:3px 3px 0 #0b1024;white-space:nowrap}
.pbtn small{font-size:14px;opacity:.85}
.pbtn.alt{background:#24315a;color:#f3ead2}
.pbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0b1024}
.maptip{position:absolute;left:8px;bottom:6px;font-size:16px;color:var(--ink-soft);background:var(--paper);padding:0 4px;pointer-events:none}
.etray{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;min-height:0}
.etray:empty{display:none}
.rg{display:flex;flex-direction:column;align-items:center;gap:4px}
.rg .dice{display:flex;gap:6px}
.rg canvas{width:40px;height:40px}
.rg .label{font-size:11px}
.rnote{font-family:var(--body);font-size:18px;color:#f6d050;text-align:center;max-width:140px;line-height:1.05}
.seg-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.seg-title h3{text-transform:none;letter-spacing:.02em;font-size:20px}
.mon{border:3px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:6px}
.mon .who{font-family:var(--display);font-size:19px;font-weight:700}
.monpic{width:96px;height:80px;border:2px solid var(--ink);background:#0c0a12;align-self:flex-start}
.mon .who .n{font-size:14px}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.dlist{display:flex;flex-wrap:wrap;gap:8px}
.dbtn{font-family:var(--display);font-size:15px;font-weight:600;border:3px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 10px;min-height:44px;cursor:pointer;flex:1 1 calc(50% - 8px)}
.dbtn.sel{background:var(--ink);color:var(--paper)}
.log{display:flex;flex-direction:column;gap:6px;font-size:19px}
.arena{width:100%;height:auto;aspect-ratio:192/128;border:3px solid var(--ink);background:#0c0a12;touch-action:manipulation}
.tgts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tgt{display:flex;flex-direction:column;gap:4px;text-align:left;border:3px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px;font-family:var(--body);font-size:17px;cursor:pointer;min-width:0}
.tgt b{font-family:var(--display);font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.tgt .n{font-size:10px}
.tgt.sel{outline:3px solid #f8e048;outline-offset:-6px}
.tgt:disabled{cursor:default;opacity:1}
.hpbar{height:6px;background:#0c0a12;border:1px solid var(--ink);display:block}
.hpbar i{display:block;height:100%;background:#6ac04a}
.trs{font-size:15px;color:#e0b038}
.trs.warn{color:#ff7a5a}
.alloc{display:flex;align-items:center;gap:8px;border-bottom:2px dotted var(--ink-soft);padding-block:6px}
.alloc .txt{flex:1;min-width:0}
.alloc .txt b{font-family:var(--display);font-size:16px;display:block}
.big2{font-size:16px;min-width:32px;text-align:center}
.log p{border-bottom:1px dotted var(--ink-soft);padding-bottom:5px}
.log p:first-child{font-weight:700}
.log p:last-child{border-bottom:0}
.banner{border:3px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px;display:flex;flex-direction:column;gap:8px}
.banner b{font-family:var(--display);font-size:20px}
.banner .btn{background:var(--paper);color:var(--ink);box-shadow:none}
/* visual Masmorra: menu de console 16 bits */
:root[data-skin="zelda"]{
  --paper:#18213d; --grid:#1d2848; --ink:#f3ead2; --ink-soft:#9aa6c4; --wash:#223056; color-scheme:dark;
}
:root[data-skin="zelda"] .sheet,:root[data-skin="zelda"] .strip,:root[data-skin="zelda"] .mapbox{box-shadow:inset 0 0 0 2px #2d3c6a}
:root[data-skin="zelda"] .btn{background:#e9dcb4;color:#18213d;border-color:#f3ead2;box-shadow:4px 4px 0 #0b1024}
:root[data-skin="zelda"] .btn.ghost{background:#24315a;color:#f3ead2}
:root[data-skin="zelda"] .mapbox{background:#0c0a12}
.topbar{display:flex;justify-content:flex-end;margin-bottom:-6px}
.gear{width:48px;height:48px;border:3px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gear canvas{width:30px;height:30px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:3px solid var(--ink);background:var(--paper);color:var(--ink);padding:10px 12px;cursor:pointer;font-family:var(--body);font-size:19px;min-height:52px}
.opt b{font-family:var(--display);font-size:17px;font-weight:700}
.opt b::before{content:"○ ";font-family:var(--body)}
.opt.on{background:var(--ink);color:var(--paper)}
.opt.on b::before{content:"● "}
.opt:disabled{opacity:.45;cursor:default}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:var(--wash);border:3px solid var(--ink)}
input[type=range]::-moz-range-track{height:10px;background:var(--wash);border:3px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:30px;background:var(--ink);border:3px solid var(--paper);outline:3px solid var(--ink);margin-top:-13px}
input[type=range]::-moz-range-thumb{width:22px;height:26px;background:var(--ink);border:3px solid var(--paper);border-radius:0}
input[type=range]:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.ticks{display:flex;justify-content:space-between;font-family:var(--display);font-size:14px;color:var(--ink-soft);margin-top:-6px}
.ticks span.on{color:var(--ink);font-weight:700}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
/* botões e etiquetas na mesma fonte dos textos, em que o 2 não parece 8 */
.btn,.dbtn,.use,.back,.opt b,.chip,.tgt b,.item{font-family:var(--body);font-weight:400;letter-spacing:.02em}
.btn{font-size:24px}
.btn small{font-size:19px}
.dbtn,.use{font-size:20px}
.opt b{font-size:21px}
.chip{font-size:17px}
.tgt b{font-size:19px}
.pwarn{display:block;flex:1 0 100%;font-family:var(--display);font-size:12px;letter-spacing:.06em;color:#ff8a7a;background:#2a0a10;border:2px solid #8a1a1a;padding:4px 6px;margin-bottom:4px;text-align:center}
.idesc{display:block;margin-top:2px;text-transform:none;letter-spacing:0;font-family:var(--body)}
.slot .idesc{font-size:14px;line-height:1.2}
.lockb{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink-soft);background:transparent;color:var(--ink-soft);cursor:pointer;padding:0;margin-right:8px;align-self:center}
.lockb.on{border-color:#e0b038;color:#e0b038}
.maphud{position:absolute;left:8px;top:8px;right:60px;display:flex;justify-content:space-between;gap:6px;background:var(--paper);border:2px solid var(--ink);padding:5px 8px;z-index:2;pointer-events:none}
.maphud span{font-family:var(--display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;gap:2px;color:var(--ink-soft)}
.mapbuff{position:absolute;left:8px;top:52px;display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid #e0a040;color:#e0a040;padding:3px 8px 3px 6px;z-index:2;pointer-events:none;font-family:var(--display);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.mapbuff canvas{width:10px;height:16px;image-rendering:pixelated}
.mapbuff b{font-family:var(--num);font-size:13px;letter-spacing:0;color:#ffd060}
.velanote{display:flex;align-items:center;gap:8px;margin-top:10px;border:2px dashed #e0a040;color:#e0a040;padding:6px 8px}
.velanote canvas{width:10px;height:16px;image-rendering:pixelated;flex:none}
.maphud b{font-family:var(--num);font-size:13px;letter-spacing:0;color:var(--ink)}
.foldh{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.ftri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid currentColor;transition:transform .15s}
.ftri.closed{transform:rotate(-90deg)}
.swaps{margin-top:8px;border-top:2px dotted var(--ink-soft);padding-top:6px}
.swaps .label{display:block;margin-bottom:2px}
/* cor dos números de PV e tochas: verde acima de 50%, amarelo até 20%, vermelho abaixo */
.lv-g{color:#2a8a2a !important}.lv-y{color:#a07800 !important}.lv-r{color:#c0302a !important}

function hasClass(n, h){ h = h || state.hero; if(!h) return false; return (CLASSES[h.cls] && CLASSES[h.cls].n === n) || (h.adv||[]).includes(n); }
function classLabel(h){ return [CLASSES[h.cls].n, ...(h.adv||[])].join(" · "); }
function knownSpells(h){ return Object.entries(h.spells||{}).filter(([n,s])=>s.max>0).map(([n])=>n); }
function H(h){
  h = h || state.hero;
  if(!h.hist) h.hist = {};
  const x = h.hist;
  ["total","bosses","dungeons","locks","sold","magic","armorLost","undead","avenged"].forEach(k=>{ if(x[k]===undefined) x[k] = 0; });
  if(!x.kills) x.kills = {}; if(!x.tags) x.tags = {}; if(!x.sets) x.sets = {};
  return x;
}
function advStatus(a, h){
  const x = H(h);
  if(a.map) return {ok:false, locked:"Requer o mapa do Mundo Expandido"};
  if(a.soon) return {ok:false, locked:"Em breve"};
  if(a.goal){ const [cur, need] = a.goal(h, x); return {ok:cur>=need, prog:`${Math.min(cur,need)}/${need}`}; }
  return {ok:!!a.ok(h, x)};
}
function recordKill(u){
  const h = state.hero; if(!h) return;
  const x = H(h);
  x.total++; x.kills[u.name] = (x.kills[u.name]||0) + 1;
  const tag = k => x.tags[k] = (x.tags[k]||0) + 1;
  if(/^Imp$/.test(u.name)) tag("imp");
  if(/Goblin/.test(u.name)) tag("goblin");
  if(RX_INSETO.test(u.name)) tag("inseto");
  if(/Vampir/.test(u.name)) tag("vampiro");
  if(has(u,"Intangível")) tag("intangivel");
  if(/Múmia/.test(u.name)) tag("mumia");
  if(/Dragão/.test(u.name)) tag("dragao");
  if(/Orc/.test(u.name) && /Rei|Líder|Chefe/.test(u.name)) tag("reiOrc");
  if(/^Lich/.test(u.name)) tag("lich");
  if(raceT("vampirao") && h.pv < h.pvMax){ h.pv = Math.min(h.pvMax, h.pv+1); cLog("Vampirão: você recupera 1 PV."); }
}

function torchFlameMask(t, seed){

}

/* fonte 3x5 para as plaquinhas do mapa */
const GLYPH = {
  "0":["111","101","101","101","111"],"1":["010","110","010","010","111"],"2":["111","001","111","100","111"],
  "3":["111","001","111","001","111"],"4":["101","101","111","001","001"],"5":["111","100","111","001","111"],
  "6":["111","100","111","101","111"],"7":["111","001","010","010","010"],"8":["111","101","111","101","111"],
  "9":["111","101","111","001","111"],"B":["110","101","110","101","110"],"O":["111","101","101","101","111"],
  "S":["111","100","111","001","111"],"A":["010","101","111","101","101"],"I":["111","010","010","010","111"],
  "D":["110","101","101","101","110"],"^":["00100","01110","10101","00100","00100"],"v":["00100","00100","10101","01110","00100"]
};
function drawText(ctx, txt, x, y, col){
  ctx.fillStyle = col || INK;
  let cx = x;
  [...txt].forEach(ch=>{
    const g = GLYPH[ch]; if(!g) return;
    g.forEach((row,ry)=>[...row].forEach((b,rx)=>{ if(b==="1") ctx.fillRect(cx+rx, y+ry, 1, 1); }));
    cx += g[0].length + 1;
  });
}
function textW(txt){ return [...txt].reduce((a,ch)=>a + (GLYPH[ch] ? GLYPH[ch][0].length + 1 : 0), 0) - 1; }
function drawSign(ctx, x, y, txt){
  const Z = isZ();
  const C = Z ? {out:"#3a2410", board:"#b07838", grain:"#7a5228", txt:"#2a1808", post:"#6a4220"} : {out:INK, board:PAPER, grain:INK, txt:INK, post:INK};
  const w = textW(txt) + 4, h = 9;
  ctx.fillStyle = C.post; ctx.fillRect(x + Math.floor(w/2) - 1, y + h, 2, Z ? 7 : 5);
  ctx.fillStyle = C.out; ctx.fillRect(x-1, y-1, w+2, h+2);
  ctx.fillStyle = C.board; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = C.grain;
  for(let i=1;i<w-1;i+=3) if((i+y)%2) ctx.fillRect(x+i, y+h-2, 2, 1);
  ctx.fillRect(x+1, y+1, 1, 1); ctx.fillRect(x+w-2, y+1, 1, 1);
  if(txt === "BOSS"){
    ctx.fillStyle = C.out; ctx.fillRect(x+w, y+2, 2, 5); ctx.fillRect(x+w+2, y+3, 1, 3); ctx.fillRect(x+w+3, y+4, 1, 1);
  }
  drawText(ctx, txt, x+2, y+2, C.txt);
}
function signPos(lv, s, txt){
  const sc = isZ() ? 2 : 1, w = (textW(txt) + 4 + (txt==="BOSS" ? 5 : 0))*sc, h = 18*sc;
  if(s.exit){ const ex = Math.round((s.x + s.w/2)*T - w/2), ey = (s.y+s.h)*T + (isZ() ? 10 : 4); let ok = true;
    for(let ty=Math.floor(ey/T); ty<=Math.floor((ey+h)/T); ty++) for(let tx=Math.floor(ex/T); tx<=Math.floor((ex+w)/T); tx++) if(lv.occ[tx+","+ty]) ok = false;
    if(ok) return [ex, ey]; }
  const free = (x, y) => {
    for(let ty=Math.floor((y-2)/T); ty<=Math.floor((y+h+1)/T); ty++)
      for(let tx=Math.floor((x-2)/T); tx<=Math.floor((x+w+1)/T); tx++)
        if(lv.occ[tx+","+ty]) return false;
    return true;
  };
  const X0 = s.x*T, Y0 = s.y*T, X1 = (s.x+s.w)*T, Y1 = (s.y+s.h)*T;
  for(let gap=3; gap<=3+T*3; gap+=T){
    const c = [];
    for(let yy=Y0; yy<=Y1; yy+=Math.max(4, Math.floor(T/2))) c.push([X1+gap, yy], [X0-w-gap, yy]);
    for(let xx=X0-w; xx<=X1; xx+=Math.max(4, Math.floor(T/2))) c.push([xx, Y1+gap], [xx, Y0-h-gap]);
    for(const [x,y] of c) if(free(x,y)) return [x,y];
  }
  return [X1+3, Y0+2];
}

function isFree(lv, x, y, w, h){ for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) if(lv.occ[xx+","+yy]) return false; return true; }
function rectFor(dir, tx, ty, W, Dp, a){
  if(dir==="N") return {x:tx-a, y:ty-Dp+1, w:W, h:Dp};
  if(dir==="S") return {x:tx-a, y:ty, w:W, h:Dp};
  if(dir==="E") return {x:tx, y:ty-a, w:Dp, h:W};
  return {x:tx-Dp+1, y:ty-a, w:Dp, h:W};
}
function fitRect(lv, dir, tx, ty, W, Dp){
  const sizes = [[W,Dp],[W,Dp-1],[W-1,Dp],[W-1,Dp-1],[W,Dp-2],[W-1,Dp-2],[2,2],[1,2],[1,1]].filter(([w,d])=>w>=1&&d>=1);
  for(const [w,dp] of sizes){
    const offs = Array.from({length:w},(_,i)=>i).sort((a,b)=>Math.abs(a-(w-1)/2)-Math.abs(b-(w-1)/2) || Math.random()-.5);
    for(const a of offs){
      const r = rectFor(dir, tx, ty, w, dp, a);
      if(isFree(lv, r.x, r.y, r.w, r.h)) return {...r, shrunk: w!==W || dp!==Dp};
    }
  }

}
function sideTiles(seg, side){
  const out = [];
  if(side==="N") for(let i=0;i<seg.w;i++) out.push([seg.x+i, seg.y]);
  if(side==="S") for(let i=0;i<seg.w;i++) out.push([seg.x+i, seg.y+seg.h-1]);
  if(side==="W") for(let i=0;i<seg.h;i++) out.push([seg.x, seg.y+i]);
  if(side==="E") for(let i=0;i<seg.h;i++) out.push([seg.x+seg.w-1, seg.y+i]);
  return out;
}
function addDoor(lv, seg, side, pref){
  const tiles = sideTiles(seg, side);
  const used = new Set(Object.values(lv.doors).map(d=>d.x+","+d.y+","+d.dir));
  let cand = tiles.map((t,i)=>({t,i})).filter(({t})=>!used.has(t[0]+","+t[1]+","+side));
  if(!cand.length) return null;
  const [dx,dy] = DIRV[side];
  const freeOut = cand.filter(({t})=>!lv.occ[(t[0]+dx)+","+(t[1]+dy)]);
  if(freeOut.length) cand = freeOut;
  let c;
  if(pref==="mid") c = cand.sort((a,b)=>Math.abs(a.i-(tiles.length-1)/2)-Math.abs(b.i-(tiles.length-1)/2))[0];
  else if(typeof pref === "number") c = cand.sort((a,b)=>Math.abs(a.i-pref)-Math.abs(b.i-pref))[0];
  else c = pick(cand);
  const door = {id:"d"+(lv.next++), seg:seg.id, x:c.t[0], y:c.t[1], dir:side, st:"closed", to:null};
  lv.doors[door.id] = door; seg.doors.push(door.id);
  return door;
}

    doors:[], pillars:!!sh.pillars, down:!!sh.down, desc:"", fx:"", chests:0, loot:null, secret:false, secretTried:false,

    if(n===3){ addDoor(lv, seg, LEFT[f], "mid"); addDoor(lv, seg, RIGHT[f], "mid"); }
    return;
  }
  const sides = [f, LEFT[f], RIGHT[f]].sort(()=>Math.random()-.5);
  for(let i=0;i<n;i++) addDoor(lv, seg, sides[i%3]);

function buildLevel(n, fromLevel, fromSeg){

    const fin = makeSeg(lv, "FIN", {x:-3,y:-9,w:8,h:8}, "N", {k:"room", name:"Sala Final", final:true});
    const pass = addDoor(lv, arr, "N", 0); pass.st = "open"; pass.to = fin.id; fin.from = pass.id;
    arr.desc = "Você desce para o terceiro nível. À sua frente está a Sala Final.";
  }
  return arr;
}

/* conteúdo e monstros */
function monsterGroup(row, first){
  if(!row) return null;
  const [q, s, p, pv, dano, tr] = row;
  const qty = Math.max(1, rollExpr(q));
  return {key:s, name: qty>1 ? p : s, qty, qexpr:q, pv, dano, tr, list:Array.from({length:qty},()=>({pv, max:pv})), first, sneak:false, sneakTried:false};
}
function applyContent(seg, roll){
  const [txt, fx] = DT().cont[roll-2];
  seg.desc = txt; seg.fx = fx;
  seg.loot = null;
  if(fx.includes("s")) seg.secret = true;
  if(fx.includes("x")) seg.chests = 1;
  if(fx.startsWith("c")) seg.loot = {coins:rollExpr("1d6")};
  if(fx==="t") seg.loot = {tres:1};
  if(fx==="t1") seg.loot = {tres:rollExpr("1d6")};
  if(fx==="t2") seg.loot = {tres:rollExpr("2d6")};
  if(fx==="m") seg.loot = {magic:rollExpr("2d6")};
  if(fx==="p") seg.loot = {scrolls:rollExpr("1d6")};
  if(fx.startsWith("q")) seg.loot = {paint:rollExpr("2d6")};
}
function lootText(l){
  if(!l) return "";
  const parts = [];
  if(l.coins) parts.push(`${l.coins} moeda${l.coins>1?"s":""}`);
  if(l.tres) parts.push(`${l.tres} Tesouro${l.tres>1?"s":""}`);
  if(l.magic) parts.push(`${l.magic} Ite${l.magic>1?"ns":"m"} Mágico${l.magic>1?"s":""}`);
  if(l.scrolls) parts.push(`${l.scrolls} Pergaminho${l.scrolls>1?"s":""}`);
  if(l.paint) parts.push(`${l.paint} quadro${l.paint>1?"s":""} de deuses`);
  return parts.join(", ");
}

/* itens e recompensas */
function makeArmor(rest){
  const [slot, pv] = ARMOR_TABLE[d6()];
  const bonus = (rest.match(/\(([+-]\d+) PV\)/)||[])[1];
  const total = pv + (bonus ? +bonus : 0);
  return {n:`${slot} ${rest}`, slot, pv:Math.max(0,total), magic:true};
}
function makeWeapon(suffix, magic){
  const [n, dmg, two] = DT().arma[d6()-1];
  return {n: suffix ? `${n} ${suffix}` : n, weapon:true, d:dmg, two:!!two, magic:!!magic};
}
function itemFrom(text, magic){
  if(text.startsWith("[Armadura]")) return makeArmor(text.replace("[Armadura] ",""));
  if(text.startsWith("[Arma]")) return makeWeapon(text.replace("[Arma] ",""), true);
  if(text.startsWith("Remo do Barqueiro")) return {n:text, weapon:true, d:"1d6+1", magic:true};
  return fixWearable({n:text, magic:!!magic});
}
function fixWearable(it){
  if(/^Chapéu do Bobo/.test(it.n)){ it.slot = "Elmo"; it.pv = 2; }
  if(/^Sandálias do Imperador/.test(it.n)){ it.slot = "Botas"; it.pv = 2; }
  return it;
}
const wearing = rx => !!(state.hero && ARMOR_SLOTS.some(s=>state.hero.armor[s] && rx.test(state.hero.armor[s].n)));
function rollTreasure(){
  const dt = DT(), e = dt.tes[d6()-1];
  if(e==="@mar") return itemFrom(dt.mar[d6()-1], true);
  if(e==="@mag") return itemFrom(dt.mag[d6()-1], true);
  if(e==="@arma") return makeWeapon("", false);
  if(e==="@scroll") return {n:`Pergaminho Mágico (${SPELLS[d6()].n})`, scroll:true, magic:true};
  return {n:e};
}
let incoming = [];
function addItem(it){
  incoming.push(it);
  if(it.slot && state.hero){ const set = it.n.split(" (")[0].replace(/^\S+\s/, ""); const x = H().sets; x[set] = x[set] || []; if(!x[set].includes(it.slot)) x[set].push(it.slot); }
  return true;
}
function flushIncoming(){
  const items = incoming; incoming = [];
  if(!items.length || !state.hero) return;
  const h = state.hero;
  if(items.length <= bagMax() - h.bag.length){ h.bag.push(...items); return; }
  const seg = curSeg();
  seg.stash = (seg.stash||[]).concat(items);
  state.ui.bagFull = true; state.ui.pick = null;
  log(`Mochila cheia! ${items.length} ite${items.length>1?"ns esperam":"m espera"} sua decisão.`);
}
function takeStash(){
  const h = state.hero, seg = curSeg(), st = seg.stash || [];
  if(st.length <= bagMax() - h.bag.length){ h.bag.push(...st); seg.stash = []; state.ui.bagFull = false; log(`Você pegou os itens deixados aqui: ${st.map(it=>it.n.split(" (")[0]).join("; ")}.`); }
  else { state.ui.bagFull = true; }
}
function collectLoot(seg){
  const l = seg.loot, h = state.hero; if(!l) return;
  const got = [];
  if(l.coins){ h.coins += l.coins; got.push(`${l.coins} moedas`); }
  for(let i=0;i<(l.tres||0);i++){ const it = rollTreasure(); if(addItem(it)) got.push(it.n); }
  for(let i=0;i<(l.magic||0);i++){ const it = itemFrom(DT().mag[d6()-1], true); if(addItem(it)) got.push(it.n); }
  for(let i=0;i<(l.scrolls||0);i++){ const it = {n:`Pergaminho Mágico (${SPELLS[d6()].n})`, scroll:true, magic:true}; if(addItem(it)) got.push(it.n); }
  for(let i=0;i<(l.paint||0);i++){ if(addItem({n:"Quadro de deus (vale 2 moedas na cidade)"})) got.push("Quadro de deus"); }
  seg.loot = null;
  log(got.length ? `Você encontrou: ${got.join("; ")}.` : "Não havia nada.");
  flushIncoming();
}

/* =========================================================
   MASMORRA: AÇÕES DO JOGO
   ========================================================= */
function blocked(seg){ return seg.mon && !seg.mon.sneak; }
function lvc(cur, max){ const p = max > 0 ? cur/max : 0; return p > .5 ? "lv-g" : p > .2 ? "lv-y" : "lv-r"; }
function hasLamp(h){ h = h || state.hero; return !!h && h.bag.some(it=>/^Lamparina/.test(it.n)); }
function wCopy(w){ return w.shield ? {n:w.n} : {n:w.n, weapon:true, d:w.d, two:w.two, magic:w.magic}; }
/* mãos: cada braço segura uma coisa; a tocha ocupa uma mão (a Lamparina libera); Duas Mãos ocupa duas */
const UNARMED = () => ({n:"Mãos nuas", d:"1d6-3", unarmed:true});
function offs(h){ h = h || state.hero; if(!h) return []; if(h.weapon2){ (h.off = h.off || []).push(h.weapon2); delete h.weapon2; } return h.off || (h.off = []); }
function handNeed(w){ return !w || w.unarmed ? 0 : w.two ? 2 : 1; }
function handsUsed(h){ h = h || state.hero; return handNeed(h.weapon) + offs(h).reduce((a,w)=>a+handNeed(w),0); }
function handsLeft(h){ h = h || state.hero; return handsFree(h) - handsUsed(h); }
function offWeapons(h){ return offs(h).map((w,i)=>({w,i})).filter(x=>!x.w.shield); }
function attacksPerTurn(h){ h = h || state.hero; const n = 1 + offWeapons(h).length; return hasClass("Multidestro", h) ? n : hasClass("Ambidestro", h) ? Math.min(2, n) : 1; }
function w2(h){ const o = offWeapons(h)[0]; return o ? o.w : null; }
/* sem a Lamparina, a segunda arma volta para a mochila */
/* mãos livres para armas: a tocha ocupa uma, a Lamparina libera; sem um braço, sobra uma só */
function handsFree(h){ h = h || state.hero; if(!h) return 1; return Math.max(0, (h.arms || 2) - (hasLamp(h) || raceT("tongue", h) ? 0 : 1)); }
/* um braço, sem Lamparina e sem poção que devolva o braço: fim de carreira ao chegar na cidade */
function mustRetire(h){ h = h || state.hero; return !!h && handsFree(h) === 0 && (h.arms||2) < 2 && !h.bag.some(it=>/^Poção da Salamandra|^Poção Mão na Roda/.test(it.n)); }
function normalizeHands(){
  const VELA_N = "Vela dos Protetores (acenda a vela e os bônus do próximo baú serão dobrados!)";
  if(state.hero) state.hero.bag.forEach(it=>{ if(/^Vela dos Protetores/.test(it.n)) it.n = VELA_N; });
  if(state.shop && state.shop.items) state.shop.items.forEach(it=>{ if(/^Vela dos Protetores/.test(it.n)) it.n = VELA_N; });
  const h = state.hero; if(!h) return;
  if((raceT("noArmor", h) || raceT("ogro", h)) && ARMOR_SLOTS.some(sl=>h.armor[sl] && !h.armor[sl].stone)){
    ARMOR_SLOTS.forEach(sl=>{ const p = h.armor[sl]; if(p && !p.stone){ h.bag.push(p); delete h.armor[sl]; } });
    persist();
  }
  const n = handsFree(h), inDg = state.dungeon && state.dungeon.inside, out = [], o = offs(h);
  while(handsUsed(h) > n && o.length){ const w = o.pop(); h.bag.push(wCopy(w)); out.push(w.n); }
  if(handsUsed(h) > n && !h.weapon.unarmed){ h.bag.push(wCopy(h.weapon)); out.push(h.weapon.n); h.weapon = UNARMED(); }
  if(!out.length) return;
  if(inDg) log(`Sem mãos livres, ${out.map(x=>x.split(" (")[0]).join(" e ")} ${out.length>1?"voltam":"volta"} para a mochila.`);
  if(state.ui && /^(weapon|off)/.test(state.ui.eqSel||"")) state.ui.eqSel = null;
  persist();
}
/* chave comum só vale na masmorra onde foi achada; Chave Mestra vale em qualquer uma */
function keyIdx(){
  const h = state.hero, d = state.dungeon; if(!h) return -1;
  const m = h.bag.findIndex(it=>/^Chave Mestra/.test(it.n)); if(m >= 0) return m;
  return h.bag.findIndex(it=>/^Chave \(/.test(it.n) && (!it.key || (d && it.key === d.name)));
}
function hasItem(rx){ return state.hero.bag.findIndex(it=>rx.test(it.n)); }

async function roll(label, n){
  const tray = $("#etray"); if(!tray) return Array.from({length:n}, d6);
  const g = document.createElement("div"); g.className = "rg";
  g.innerHTML = `<div class="dice"></div><span class="label">${esc(label)}</span>`;
  tray.appendChild(g);
  const v = await rollInto(g.querySelector(".dice"), n);
  rollLog.push({label, vals:v, el:g});
  return v;
}
/* legenda embaixo do dado: o que o resultado significa */
function rollNote(text, label){
  for(let i=rollLog.length-1;i>=0;i--){
    const r = rollLog[i]; if(label && r.label !== label) continue;
    r.note = text;
    if(r.el && r.el.isConnected){ let n = r.el.querySelector(".rnote"); if(!n){ n = document.createElement("span"); n.className = "rnote"; r.el.appendChild(n); } n.textContent = text; }
    return;
  }
}
async function rollPar(specs){
  return Promise.all(specs.map(([l,n])=>roll(l,n)));
}
function startAction(){ busy = true; rollLog = []; const t = $("#etray"); if(t) t.innerHTML = ""; lockButtons(); }
function endAction(){ busy = false; flushIncoming(); mapVersion++; persist(); render(); }

/* tochas e escuridão */
function spendTorch(n, why){
  const h = state.hero;
  let need = n;
  const luz = h.spells["Luz"];
  while(need > 0 && h.torches > 0){ h.torches--; need--; }
  while(need > 0 && luz && luz.left > 0){ luz.left--; need--; log("Você conjurou Luz no lugar de uma tocha."); }
  if(need > 0 && raceT("fira")){
    h.pv = Math.max(0, h.pv - 2*need); log(`Sem tochas, você usa sua própria luz (−${2*need} PV).`);
    if(why) log(`${why}.`);
    if(h.pv <= 0){ killHero("Consumido pela própria luz"); return false; }
    return true;
  }
  if(why) log(`${why} (−${n} tocha${n>1?"s":""}).`);
  if(h.torches === 0 && D() && D().inside && !raceT("fira")){
    if(luz && luz.left > 0){ luz.left--; h.torches = 1; log("Sem tochas, você conjurou Luz para não ficar no escuro."); return true; }
    if(hasClass("Minerador") && pathClear()){
      log("As tochas acabaram, mas como Minerador você achou o caminho de volta no escuro.");
      leaveDungeon(); return false;
    }
    killHero("Devorado pela escuridão");
    return false;
  }
  return true;
}
function samambro(){
  const h = state.hero; if(!h || !raceT("samambro")) return false;
  const v = d6();
  if(v >= 3){ h.pv = 1; log(`Samambro: você caiu, mas o dado deu ${v} e você voltou à vida com 1 PV!`); return true; }
  log(`Samambro: o dado deu ${v}. Não foi dessa vez.`); return false;
}
function hurt(n, cause){
  const h = state.hero;
  if(hasShield(h) && n > 0){ const v = Math.min(n, shieldVal(h)); n -= v; log(`${offs(h).filter(w=>w.shield).length > 1 ? "Seus escudos seguram" : "O escudo segura"} ${v} de dano.`); }
  if(h.shield > 0){ const a = Math.min(h.shield, n); h.shield -= a; n -= a; log(`O Escudo Mágico absorve ${a} de dano.`); }
  h.pv = Math.max(0, h.pv - n);
  if(h.pv <= 0 && samambro()) return true;
  log(`Você sofreu ${n} de dano.`);
  if(h.pv <= 0){ killHero(cause); return false; }
  return true;
}
function killHero(cause){
  const h = state.hero, d = D();
  state.cemetery.push({name:h.name, who:`${raceName(h)} ${classLabel(h)}`, where:d && d.inside ? d.name : (d? d.name : ""), cause});
  if(d && d.inside){
    d.corpses.push({level:d.pos.level, seg:d.pos.seg, name:h.name, bag:h.bag, coins:h.coins});
    d.inside = false;
    log(`${h.name} morreu aqui. ${cause}.`);
  }
  state.hero = null; state.ui = {lastDeath:{name:h.name, cause}};
  state.screen = "cemetery";
}
function pathClear(){
  const d = D();
  for(let l=1; l<=d.pos.level; l++){
    const lv = d.levels[l]; if(!lv) continue;
    for(const s of Object.values(lv.segs)) if(blocked(s) && !(l===d.pos.level && s.id===d.pos.seg && false)) return false;
  }
  return true;
}
function leaveDungeon(){
  const d = D(), h = state.hero;
  d.inside = false;
  if(h){
    if(d.complete && !(d.countedFor||[]).includes(h.name)){ d.countedFor = (d.countedFor||[]).concat(h.name); H(h).dungeons++; }
    ARMOR_SLOTS.forEach(sl=>{ if(h.armor[sl] && h.armor[sl].stone){ delete h.armor[sl]; log("A Armadura de Pedra se desfaz em pó."); } });
    h.bag = h.bag.filter(it=>!it.stone);
  }
  log("Você saiu da masmorra e voltou para a cidade.");
  state.screen = "city";
}

/* armadilhas */
async function trap(origin){
  const seg = curSeg(), h = state.hero;
  seg.trapSeen = true;
  if(seg.disarmed){ log("Uma armadilha disparou, mas você já tinha desarmado este lugar."); return true; }
  if(raceT("ar")){ log("Uma armadilha dispara, mas você a ignora como o vento."); return true; }
  const luck = hasItem(/^Poção da Sorte/);
  const [v] = await roll("Armadilha", 1);
  const t = DT().trap[v-1];
  rollNote(t[0]==="nada" ? "Nada acontece" : t[0]==="blade" ? "Lâmina" : t[0]==="pit" ? "Fosso" : t[0]==="mon" ? "Monstros!" : t[0]==="dmg" ? `${t[2]} de dano` : "Armadilha");
  if(t[0] === "nada"){ log(t[1]); return true; }
  if(luck >= 0){ h.bag.splice(luck,1); log(`${t[1]} A Poção da Sorte te livrou da armadilha.`); return true; }
  if(seg.mon && seg.mon.sneak){ seg.mon.sneak = false; log("O barulho da armadilha alertou os monstros: você não está mais escondido."); }
  if(t[0]==="blade"){
    const [b] = await roll("Lâmina", 1);
    rollNote(b===1 ? "Golpe mortal" : b===2 ? "Perde um braço" : "Passa raspando");
    if(b===1){
      if(hasItem(/^Coroa do Príncipe Degolado/) >= 0){ log("Uma lâmina desce do teto. A Coroa do Príncipe Degolado te salvou da morte."); return true; }
      killHero("Uma lâmina desceu do teto"); return false;
    }
    if(b===2){ h.arms = (h.arms||2) - 1; log(`Uma lâmina desce do teto e arranca um dos seus braços. Restam ${h.arms}.`); return true; }
    log("Uma lâmina desce do teto e passa raspando."); return true;
  }
  if(t[0]==="dmg"){ log(t[1]); return hurt(t[2], t[1].replace(/\.$/,"")); }
  if(t[0]==="pit"){ log(t[1]); return spendTorch(1, "Saindo do fosso"); }
  if(t[0]==="mon" && seg.exit){ log(`${t[1]} Mas nada surge aqui: a primeira sala nunca tem monstros.`); return true; }
  if(t[0]==="mon"){
    const g = monsterGroup(t[2], "hero");
    seg.mon = mergeMon(seg.mon, g);
    log(`${t[1]} ${g.qty} ${g.name}.`);
    return true;
  }
  return true;
}
function mergeMon(a, b){
  if(!a) return b;
  if(a.name === b.name || a.pv === b.pv && a.dano === b.dano){ a.list.push(...b.list); a.qty = a.list.length; a.sneak = false; return a; }
  a.extra = (a.extra||[]).concat([b]); a.sneak=false; return a;
}

/* abrir porta */
async function doOpenDoor(id){
  const lv = LV(), door = lv.doors[id], h = state.hero;
  door.boss = isBossDoor(lv, door);
  startAction();
  if(!spendTorch(1, "Abrindo a porta")){ endAction(); return; }
  const [v] = await roll("Porta", 1);
  rollNote(v === 1 ? "Armadilha!" : v <= 3 ? "Trancada" : "Destrancada");
  if(v === 1 && raceT("arenoso")){
    log("A porta tinha uma armadilha, mas você passa por ela sem ativá-la.");
    door.st = "open"; await reveal(door, true);
  } else if(v <= 3 && v > 1 && (raceT("arenoso") || raceT("agua"))){
    log("A porta está trancada, mas você passa por ela mesmo assim.");
    door.st = "open"; await reveal(door, true);
  } else if(v === 1){
    log("Ao mexer na porta, você ativou uma armadilha!");
    const alive = await trap("door");
    if(!alive || !state.hero){ endAction(); return; }
    door.st = "open";
    await reveal(door, true);
  } else if(v <= 3){
    door.st = "locked";
    log("A porta está trancada.");
    state.ui.selDoor = id;
  } else {
    door.st = "open";
    log("A porta está destrancada.");
    await reveal(door, true);
  }
  endAction();
}
async function doUnlock(id, how){
  const lv = LV(), door = lv.doors[id], h = state.hero;
  door.boss = isBossDoor(lv, door);
  startAction();
  let quiet = true;
  if(how === "pick"){
    if(hasClass("Chaveiro") || hasClass("Ladrão")) log("Como Chaveiro, você abriu a fechadura sem gastar tocha.");
    else if(!spendTorch(1, "Abrindo a fechadura")){ endAction(); return; }
    door.st = "open";
    H(h).locks++;
  } else if(how === "key"){
    H(h).locks++;
    const k = keyIdx(); if(k < 0){ endAction(); return; }
    log(`Você abriu a fechadura com ${/^Chave Mestra/.test(h.bag[k].n) ? "a Chave Mestra" : "a chave desta masmorra"}. A chave quebrou na fechadura.`);
    h.bag.splice(k,1);
    door.st = "open";
  } else {
    quiet = raceT("lobis");
    door.st = "broken";
    if(quiet) log("Como Lobisóide, você avança antes que os monstros reajam.");
    log("Você quebrou a porta. Todos os monstros do outro lado ouviram.");
    const seg = curSeg();
    if(seg.mon && seg.mon.sneak){ seg.mon.sneak = false; seg.mon.first = "mon"; log("O barulho alertou os monstros daqui também."); }
    if(hasClass("Lenhador")){
      const [l] = await roll("Lenhador", 1);
      rollNote(l === 6 ? "+1 tocha" : "Nada");
      if(l === 6){ h.torches = Math.min(10, h.torches+1); log("Da madeira da porta você fez 1 tocha."); }
    }
  }
  if(!state.hero){ endAction(); return; }
  await reveal(door, quiet);
  endAction();
}
async function reveal(door, quiet){
  const d = D(), lv = LV(), from = lv.segs[door.seg], h = state.hero;
  const [dx,dy] = DIRV[door.dir];
  const tx = door.x+dx, ty = door.y+dy;
  const existing = lv.occ[tx+","+ty];
  state.ui.selDoor = null;
  if(existing){
    door.to = existing;
    log(`A porta leva de volta para ${lv.segs[existing].name.toLowerCase()}.`);
    moveTo(existing, true);
    return;
  }
  if(door.boss){
    door.boss = false;
    let rect = null;
    for(const [w,dp] of [[8,8],[7,7],[6,6],[5,5],[4,4]]){ rect = fitRect(lv, door.dir, tx, ty, w, dp); if(rect && !rect.shrunk) break; rect = null; }
    if(!rect) rect = fitRect(lv, door.dir, tx, ty, 6, 6);
    if(rect){
      const fin = makeSeg(lv, "FIN", rect, door.dir, {from:door.id, k:"room", name:"Sala Final"});
      door.to = fin.id; lv.last = fin.id; fin.bossRolled = true;
      log("Esta era a última porta do nível e não havia escada para descer: atrás dela está a Sala Final!");
      moveTo(fin.id, true);
      busy = false; mapVersion++; persist(); render();
      await doBoss(fin);
      return;
    }
  }
  const col = from.k === "stairs" ? "stairs" : from.k === "corr" ? "corr" : "room";
  const table = col === "stairs" ? SEG_STAIRS : col === "corr" ? DT().corr : DT().room;
  const [sv] = await roll("Segmento", 1);
  const code = table[sv-1], sh = SHAPES[code];
  rollNote(sh.n);
  const rect = fitRect(lv, door.dir, tx, ty, sh.w, sh.d);
  if(!rect){ door.st = "rubble"; log("Atrás da porta só há escombros. Não dá para passar."); return; }
  const seg = makeSeg(lv, code, rect, door.dir, {from:door.id, quiet});
  door.to = seg.id;
  addNewSegDoors(lv, seg, code);
  if(rect.shrunk) seg.name += " (estreita)";

}

function walkPath(lv, a, b){
  const prev = {[a]:null}, q = [a];
  while(q.length){
    const s = q.shift(); if(s===b) break;
    const seg = lv.segs[s];
    const ids = seg.doors.map(id=>lv.doors[id]).filter(dd=>dd.to && ["open","broken","secret"].includes(dd.st)).map(dd=>dd.to);
    if(seg.from){ const dd = lv.doors[seg.from]; if(dd) ids.push(dd.seg); }
    Object.values(lv.doors).forEach(dd=>{ if(dd.to===s && ["open","broken","secret"].includes(dd.st)) ids.push(dd.seg); });
    ids.forEach(n=>{ if(!(n in prev)){ prev[n] = s; q.push(n); }});
  }
  if(!(b in prev)) return null;
  const path = []; for(let x=b; x!==null; x=prev[x]) path.unshift(x);
  return path;
}
/* anda sala por sala: cada sala no caminho pode ter monstros e interrompe a caminhada */
async function doWalk(id){
  const d = D(), lv = LV();
  startAction();
  const path = walkPath(lv, d.pos.seg, id) || [d.pos.seg, id];
  for(let k=1; k<path.length; k++){
    const seg = lv.segs[path[k]];
    moveTo(seg.id);
    if(seg.k !== "room" || seg.final || seg.exit) continue;
    if(!seg.mon && seg.ret < d.visits){
      seg.ret = d.visits;
      render();
      const mv = await roll("Monstros", 2);
      const m = mv[0]+mv[1];
      seg.mon = monsterGroup(DT().mon[m-2], "hero");
      rollNote(seg.mon ? `${seg.mon.qty} ${seg.mon.name}` : "Nenhum monstro");
      if(seg.mon) log(`Enquanto você esteve fora, ${seg.mon.qty} ${seg.mon.name} ocuparam ${seg.name.toLowerCase()}.`);
      else log(`${seg.name} continua vazia.`);
    }
    if(seg.mon && k < path.length-1){
      log(seg.mon.sneak ? `Você para em ${seg.name.toLowerCase()}: ${seg.mon.qty} ${seg.mon.name} ainda estão aqui.` : `${seg.mon.qty} ${seg.mon.name} bloqueiam a passagem em ${seg.name.toLowerCase()}.`);
      break;
    }
    if(seg.mon) break;
  }
  endAction();
}

async function doSecret(){
  const seg = curSeg(), lv = LV(), h = state.hero;
  startAction();
  if(!spendTorch(1, "Procurando passagem secreta")){ endAction(); return; }
  seg.secretTried = true;
  const dwarf = raceT("secret2");
  const v = await roll(dwarf ? "Passagem (Anão)" : "Passagem", dwarf ? 2 : 1);
  const r = Math.max(...v);
  rollNote(r === 1 ? "Armadilha!" : r <= 3 ? "Nada" : r <= 5 ? "Baú escondido" : "Passagem secreta!");
  if(r === 1){ log("Procurando a passagem, você ativou uma armadilha!"); await trap("secret"); }
  else if(r <= 3) log("Não há nada aqui.");
  else if(r <= 5){ seg.chests++; log("Você encontrou um Baú escondido!"); }
  else {
    const sides = [seg.fwd, LEFT[seg.fwd], RIGHT[seg.fwd]].sort(()=>Math.random()-.5);
    let ok = false;
    for(const s of sides){
      const door = addDoor(lv, seg, s);
      if(!door) continue;
      const [dx,dy] = DIRV[s];
      const rect = fitRect(lv, s, door.x+dx, door.y+dy, 1, 2);
      if(!rect || lv.occ[(door.x+dx)+","+(door.y+dy)]){ delete lv.doors[door.id]; seg.doors.pop(); continue; }
      const st = makeSeg(lv, "E", rect, s, {from:door.id, desc:"Uma escadaria escondida que desce para o próximo nível."});
      door.st = "secret"; door.to = st.id;
      st.name = "Escadaria secreta";
      log("Você encontrou uma passagem secreta para uma escadaria!");
      ok = true; break;
    }
    if(!ok) log("Você sente uma corrente de ar, mas a passagem está bloqueada.");
  }
  endAction();
}

/* regra do livro: sem escada para descer, a última porta fechada do nível leva ao Chefe */
const BOSS_MIN_ROOMS = 3; /* evita que a primeira porta da masmorra já seja a do Chefe */
function isBossDoor(lv, door){
  if(!door || lv.n >= 3 || D().complete) return false;
  if(Object.values(lv.segs).some(s=>s.final || s.down)) return false;
  if(!(door.st==="closed" || door.st==="locked")) return false;
  if(Object.values(lv.segs).filter(s=>s.k==="room" && !s.exit).length < BOSS_MIN_ROOMS) return false;
  const left = Object.values(lv.doors).filter(dd=>dd.st==="closed"||dd.st==="locked");
  if(left.length !== 1 || left[0].id !== door.id) return false;
  const [dx,dy] = DIRV[door.dir];
  return !lv.occ[(door.x+dx)+","+(door.y+dy)];
}
function bossDoorOf(lv){ return Object.values(lv.doors).find(dd=>isBossDoor(lv, dd)) || null; }
function levelExhausted(lv){
  if(lv.n >= 3) return false;
  if(Object.values(lv.segs).some(s=>s.final)) return false;
  if(Object.values(lv.doors).some(dd=>dd.st==="closed"||dd.st==="locked")) return false;
  if(Object.values(lv.segs).some(s=>s.down)) return false;
  return !!lv.last;
}

   MAPA: DESENHO

let cam = {x:0, y:0, z:3};
function clampZ(z){ return isZ() ? Math.max(.3, Math.min(2.6, z)) : Math.max(1.2, Math.min(9, z)); }
let centerOn = true;
let mapCache = {ver:-1, level:-1, cv:null, ox:0, oy:0};
function segCenter(s){ return {x:(s.x + s.w/2)*T, y:(s.y + s.h/2)*T}; }
function doorRect(dd){
  if(isZ()) return doorRectZ(dd, LV());
  const x = dd.x*T, y = dd.y*T;
  if(dd.dir==="N") return [x+1, y-3, 6, 6];
  if(dd.dir==="S") return [x+1, y+T-3, 6, 6];
  if(dd.dir==="E") return [x+T-3, y+1, 6, 6];
  return [x-3, y+1, 6, 6];
}
function drawDoor(ctx, dd){
  const [x,y] = doorRect(dd);
  const hz = dd.dir==="N" || dd.dir==="S";
  // desenha numa orientação horizontal e gira para portas em paredes verticais
  const P = (px,py,c) => { ctx.fillStyle = c; if(hz) ctx.fillRect(x+px, y+py, 1, 1); else ctx.fillRect(x+py, y+px, 1, 1); };
  const R = (px,py,w,h,c) => { for(let i=0;i<w;i++) for(let j=0;j<h;j++) P(px+i,py+j,c); };
  R(0,0,6,6,PAPER);
  // batentes de pedra
  R(-1,0,1,6,INK); R(6,0,1,6,INK); R(-2,1,1,4,INK); R(7,1,1,4,INK);
  const st = dd.st;
  if(st==="closed"){
    R(0,1,6,4,INK); R(1,2,4,2,PAPER); P(3,2,INK); P(3,3,INK); P(1,2,INK);
  } else if(st==="locked"){
    R(0,1,6,4,INK); P(2,2,PAPER); P(3,2,PAPER); P(2,3,PAPER);
  } else if(st==="open"){
    const inward = (dd.dir==="N"||dd.dir==="W") ? 1 : -1;
    R(0,0,1,6,INK);
    if(inward>0){ R(1,-3,1,3,INK); } else { R(1,6,1,3,INK); }
  } else if(st==="secret"){
    for(let i=0;i<6;i+=2) P(i,2,INK);
  } else if(st==="broken"){
    P(0,1,INK); P(4,1,INK); P(2,3,INK); P(5,4,INK); P(1,5,INK); P(3,0,INK);
  } else if(st==="rubble"){
    for(let i=0;i<6;i++) for(let j=0;j<6;j++) if((i+j)%2===0 || (i*j)%3===1) P(i,j,INK);
  }
}
function buildStatic(lv){
  const segs = Object.values(lv.segs);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  segs.forEach(s=>{ x0=Math.min(x0,s.x); y0=Math.min(y0,s.y); x1=Math.max(x1,s.x+s.w); y1=Math.max(y1,s.y+s.h); });
  x0-=4; y0-=4; x1+=6; y1+=4;
  const W = (x1-x0)*T, H = (y1-y0)*T;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.translate(-x0*T, -y0*T);
  ctx.fillStyle = PAPER; ctx.fillRect(x0*T, y0*T, W, H);
  // hachura em volta das salas, como mapa de caderno
  ctx.fillStyle = INK;
  for(let ty=y0; ty<y1; ty++) for(let tx=x0; tx<x1; tx++){
    if(lv.occ[tx+","+ty]) continue;
    let near = false;
    for(let a=-1;a<=1&&!near;a++) for(let b=-1;b<=1;b++) if(lv.occ[(tx+a)+","+(ty+b)]){ near=true; break; }
    if(!near) continue;
    for(let py=0;py<T;py++) for(let px=0;px<T;px++){
      const gx = tx*T+px, gy = ty*T+py;
      if((gx+gy)%4===0) ctx.fillRect(gx, gy, 1, 1);
    }
  }
  segs.forEach(s=>{
    const X = s.x*T, Y = s.y*T, Wd = s.w*T, Hd = s.h*T;
    ctx.fillStyle = PAPER; ctx.fillRect(X, Y, Wd, Hd);
    ctx.fillStyle = INK;
    // pontos do quadriculado
    for(let ty=1; ty<s.h; ty++) for(let tx=1; tx<s.w; tx++) ctx.fillRect(X+tx*T, Y+ty*T, 1, 1);
    // paredes
    ctx.fillRect(X, Y, Wd, 1); ctx.fillRect(X, Y+Hd-1, Wd, 1); ctx.fillRect(X, Y, 1, Hd); ctx.fillRect(X+Wd-1, Y, 1, Hd);
    if(s.k==="stairs"){
      const vertical = s.fwd==="N"||s.fwd==="S";
      if(vertical){ for(let yy=Y+2; yy<Y+Hd-1; yy+=3) ctx.fillRect(X+1, yy, Wd-2, 1); }
      else { for(let xx=X+2; xx<X+Wd-1; xx+=3) ctx.fillRect(xx, Y+1, 1, Hd-2); }
      // degraus mais escuros no fundo
      const far = s.fwd;
      if(far==="N") ctx.fillRect(X+1, Y+1, Wd-2, 2);
      if(far==="S") ctx.fillRect(X+1, Y+Hd-3, Wd-2, 2);
      if(far==="E") ctx.fillRect(X+Wd-3, Y+1, 2, Hd-2);
      if(far==="W") ctx.fillRect(X+1, Y+1, 2, Hd-2);
    }
    if(s.pillars){
      [[1,1],[s.w-2,1],[1,s.h-2],[s.w-2,s.h-2]].forEach(([a,b])=>{
        const cx = X+a*T+2, cy = Y+b*T+2; ctx.fillRect(cx+1, cy, 2, 4); ctx.fillRect(cx, cy+1, 4, 2);
      });
    }
    if(s.final){
      const cx = X+Wd/2, cy = Y+Hd/2;
      for(let a=0;a<32;a++){ const an = a/32*Math.PI*2; ctx.fillRect(Math.round(cx+Math.cos(an)*14), Math.round(cy+Math.sin(an)*14), 1, 1); }
      for(let a=0;a<5;a++){ const an = -Math.PI/2 + a/5*Math.PI*2, an2 = -Math.PI/2 + ((a+2)%5)/5*Math.PI*2;
        for(let t=0;t<=1;t+=.06) ctx.fillRect(Math.round(cx+Math.cos(an)*14*(1-t)+Math.cos(an2)*14*t), Math.round(cy+Math.sin(an)*14*(1-t)+Math.sin(an2)*14*t), 1, 1); }
    }
    if(s.chests>0){ const cx = X+3, cy = Y+Hd-8; ctx.fillRect(cx, cy, 6, 5); ctx.fillStyle = PAPER; ctx.fillRect(cx+1, cy+2, 4, 2); ctx.fillStyle = INK; ctx.fillRect(cx+2, cy+1, 2, 1); }

const SKULL = [".kkk.","kpkpk","kkkkk",".kpk."];
function drawSprite(ctx, sp, x, y){
  sp.forEach((row,ry)=>[...row].forEach((c,rx)=>{
    if(c==="k"){ ctx.fillStyle = INK; ctx.fillRect(x+rx,y+ry,1,1); }

}
const HERO = ["..k..",".kkk.","..k..",".kkk.","k.k.k",".k.k.",".k.k."];
const HERO_P = [".ppp.","ppppp",".ppp.","ppppp","ppppp","ppppp",".ppp."];
function drawMap(cv){
  const d = D(); if(!d || !d.pos) return;
  const lv = LV();
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const bw = Math.round(cv.clientWidth*dpr), bh = Math.round(cv.clientHeight*dpr);
  if(!bw || !bh) return;
  if(cv.width !== bw || cv.height !== bh){ cv.width = bw; cv.height = bh; }
  if(mapCache.ver !== mapVersion || mapCache.level !== lv.n){
    const r = isZ() ? buildStaticZ(lv) : buildStatic(lv); mapCache = {ver:mapVersion, level:lv.n, ...r};
  }
  const seg = lv.segs[d.pos.seg];
  if(centerOn && seg){ const c = segCenter(seg); cam.x = c.x; cam.y = c.y; centerOn = false; }
  const ctx = cv.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = isZ() ? VOID : PAPER; ctx.fillRect(0,0,bw,bh);
  const z = cam.z*dpr;
  ctx.setTransform(z,0,0,z, Math.round(bw/2 - cam.x*z), Math.round(bh/2 - cam.y*z));
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mapCache.cv, mapCache.ox, mapCache.oy);
  const t = frame/8;
  placeDoorPop(cv, lv);
  if(isZ()){ drawOverlayZ(ctx, lv, seg, t); return; }
  // monstros
  Object.values(lv.segs).forEach(s=>{
    if(!s.mon) return;
    const c = segCenter(s);
    const bob = (Math.floor(frame/4 + s.x) % 2);
    const n = s.mon.list.length + (s.mon.extra||[]).reduce((a,e)=>a+e.list.length,0);
    const show = Math.min(n, s.w*s.h >= 9 ? 3 : 1);
    for(let i=0;i<show;i++){
      const ox = (i - (show-1)/2)*7;
      drawSprite(ctx, s.mon.sneak ? [".kkk.","kkkkk","kkkkk",".kpk."] : SKULL, Math.round(c.x+ox-2), Math.round(c.y-8 + (i%2?bob:-bob)));
    }
    if(s.mon.boss){ ctx.fillStyle = INK; ctx.fillRect(Math.round(c.x-3), Math.round(c.y-12), 7, 1); ctx.fillRect(Math.round(c.x-3), Math.round(c.y-14), 1, 2); ctx.fillRect(Math.round(c.x), Math.round(c.y-14), 1, 2); ctx.fillRect(Math.round(c.x+3), Math.round(c.y-14), 1, 2); }
    if(n>1 && !s.mon.boss) drawText(ctx, String(Math.min(n,9)), Math.round(c.x+ (show*7)/2 + 1), Math.round(c.y-8));
  });
  // porta selecionada pisca
  const sel = state.ui.selDoor && lv.doors[state.ui.selDoor];
  if(sel && frame%4<2){ const [x,y,w,h] = doorRect(sel); ctx.fillStyle = INK; ctx.fillRect(x-3,y-3,w+6,1); ctx.fillRect(x-3,y+h+2,w+6,1); ctx.fillRect(x-3,y-3,1,h+6); ctx.fillRect(x+w+2,y-3,1,h+6); }
  // herói com tocha
  if(seg && state.hero && !(state.ui.tele && Math.floor(t/350)%2)){
    const c = segCenter(seg);
    const hx = Math.round(c.x - 2 + (seg.mon ? 0 : 0)), hy = Math.round(c.y + (seg.mon ? 7 : -3));
    drawSprite(ctx, HERO_P, hx, hy); drawSprite(ctx, HERO, hx, hy);
    ctx.fillStyle = INK; ctx.fillRect(hx+5, hy+1, 1, 4);
    drawFlame(ctx, hx+5, hy, t, 3, .45);
  }
}

/* toque, arrasto e pinça no mapa */
function bindMap(cv){
  const pts = new Map();
  let start = null, pinch = null;
  cv.addEventListener("pointerdown", e=>{
    cv.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size===1) start = {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, t:performance.now(), moved:false};
    if(pts.size===2){
      const [a,b] = [...pts.values()];
      pinch = {dist:Math.hypot(a.x-b.x,a.y-b.y), z:cam.z};
      if(start) start.moved = true;
    }
  });
  cv.addEventListener("pointermove", e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size===2 && pinch){
      const [a,b] = [...pts.values()];
      const dd = Math.hypot(a.x-b.x,a.y-b.y);
      cam.z = clampZ(pinch.z * dd / pinch.dist);
      return;
    }
    if(pts.size===1 && start){
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if(Math.abs(dx)+Math.abs(dy) > 6) start.moved = true;
      cam.x = start.cx - dx/cam.z; cam.y = start.cy - dy/cam.z;
    }
  });
  const end = e=>{
    const wasTap = pts.size===1 && start && !start.moved && performance.now()-start.t < 450;
    pts.delete(e.pointerId);
    if(pts.size<2) pinch = null;
    if(wasTap){
      const r = cv.getBoundingClientRect();
      const wx = cam.x + (e.clientX - r.left - r.width/2)/cam.z;
      const wy = cam.y + (e.clientY - r.top - r.height/2)/cam.z;
      mapTap(wx, wy);
    }
    if(pts.size===0) start = null;
  };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", e=>{ pts.delete(e.pointerId); pinch=null; start=null; });
  cv.addEventListener("wheel", e=>{ e.preventDefault(); cam.z = clampZ(cam.z * (e.deltaY<0?1.15:1/1.15)); }, {passive:false});
}

  if(!id || id===d.pos.seg) return;
  if(blocked(cur)){ state.ui.msg = "Você não pode sair daqui com monstros te encarando."; render(); return; }
  if(!reachable(lv, d.pos.seg, id)){ state.ui.msg = "Não há caminho aberto até lá."; render(); return; }
  doWalk(id);
}
function reachable(lv, a, b){
  const seen = new Set([a]), q = [a];
  while(q.length){
    const s = q.shift(); if(s===b) return true;
    const seg = lv.segs[s];
    const ids = [...seg.doors.map(id=>lv.doors[id]).filter(dd=>dd.to && ["open","broken","secret"].includes(dd.st)).map(dd=>dd.to)];
    if(seg.from){ const dd = lv.doors[seg.from]; if(dd) ids.push(dd.seg); }
    Object.values(lv.doors).forEach(dd=>{ if(dd.to===s && ["open","broken","secret"].includes(dd.st)) ids.push(dd.seg); });
    ids.forEach(n=>{ if(!seen.has(n)){ seen.add(n); q.push(n); }});
  }
  return false;
}

  const r = R(dr.race), r2 = R(dr.race2), c = CLASSES[dr.cls], out = [];

  return out;
}

function draftSpell(e){ return typeof e === "number" ? {t:"basica", v:e} : e; }

function buildSpells(dr){
  const map = {};
  const add = (n,q) => map[n] = (map[n]||0) + q;
  [R(dr.race), R(dr.race2), CLASSES[dr.cls]].forEach(x=>{ if(x && x.fixed) Object.entries(x.fixed).forEach(([n,q])=>add(n,q)); });
  dr.spells.forEach(e=>{ const x = draftSpell(e); add(spellRollName(x.t, x.v),1); });
  return map;
}
function raceStart(dr){
  const rs = [R(dr.race), R(dr.race2)].filter(Boolean);
  return {coins: rs.reduce((a,r)=>a+(r.coins||0),0), gun: rs.some(r=>r.gun), arms: Math.max(2, ...rs.map(r=>r.arms||2))};
}
function spellSummary(dr){ return Object.entries(buildSpells(dr)).map(([n,q])=>q>1?`${n} ×${q}`:n).join(", "); }

function itemActs(it, i){
  const acts = [];
  const noArmor = raceT("noArmor") || raceT("ogro"), noPot = raceT("ogro");
  if(it.slot) acts.push(`<button class="use" data-act="equip" data-i="${i}" ${noArmor?"disabled":""}>Vestir</button>`);
  const h0 = state.hero;
  if(isShield(it)) acts.push(`<button class="use" data-act="wieldShield" data-i="${i}" ${handsLeft() >= 1 ? "" : "disabled"}>Empunhar escudo</button>`);
  if(it.weapon){
    const need = it.two ? 2 : 1;
    if(handsFree() < need) acts.push(`<button class="use" disabled>Empunhar</button>`);
    else if(h0.weapon.unarmed) acts.push(`<button class="use" data-act="wield" data-i="${i}" data-s="main">Empunhar${it.two?" (Duas Mãos)":""}</button>`);
    else {
      acts.push(`<button class="use" data-act="wield" data-i="${i}" data-s="main">Na mão principal</button>`);
      if(handsLeft() >= need) acts.push(`<button class="use" data-act="wield" data-i="${i}" data-s="off">Na mão livre</button>`);
    }
  }
  const sp = (it.n.match(/^Pergaminho Mágico \((.+)\)/)||[])[1];
  const inDg = state.dungeon && state.dungeon.inside;
  const combatOnly = /^Poção da Fúria/.test(it.n) || (sp && !/^(Cura|Luz)$/.test(sp) && !(sp === "Teletransporte" && inDg));
  if(/^Vela dos Protetores/.test(it.n)) acts.push(`<button class="use" data-act="useItem" data-i="${i}">Acender</button>`);
  if(/^Poção|^Pergaminho|^Safira/.test(it.n) && !combatOnly) acts.push(`<button class="use" data-act="useItem" data-i="${i}" ${noPot && /^Poção|^Pergaminho/.test(it.n)?"disabled":""}>Usar</button>`);
  acts.push(`<button class="use" data-act="drop" data-i="${i}">Descartar</button>`);
  const handNote = () => handsFree() === 0 ? "A única mão que sobra segura a tocha." : !hasLamp() && !raceT("tongue") ? "Todas as mãos estão ocupadas, e a tocha segura uma delas. A Lamparina libera essa mão." : "Todas as mãos estão ocupadas. Desequipe algo para liberar uma.";
  const note = isShield(it) && handsLeft() < 1 ? `<p class="muted small">O escudo ocupa uma mão. ${handNote()}</p>` : it.slot && noArmor ? `<p class="muted small">Sua raça não pode vestir armadura.</p>` : noPot && /^Poção|^Pergaminho/.test(it.n) ? `<p class="muted small">Ogros não usam poções nem pergaminhos.</p>` : combatOnly ? `<p class="muted small">${sp === "Teletransporte" ? "Só dá para usar dentro da masmorra." : "Só dá para usar durante um combate."}</p>` : it.weapon && handsFree() < (it.two ? 2 : 1) ? `<p class="muted small">${it.two ? "Armas de Duas Mãos precisam de duas mãos livres." : ""} ${handNote()}</p>` : "";
  return `<div class="item-acts">${acts.join("")}</div>${note}`;
}

      ${handsFree() >= 2 ? `<p class="muted small">${(h.arms||2) > 2 ? `${h.arms} braços. ` : ""}${hasLamp() ? "A Lamparina libera a mão da tocha." : raceT("tongue") ? "A língua segura a tocha." : "Uma das mãos segura a tocha."} ${offWeapons(h).length ? (attacksPerTurn(h) > 1 ? `Como ${hasClass("Multidestro")?"Multidestro":"Ambidestro"}, ${attacksPerTurn(h)} armas atacam no mesmo turno.` : "No combate, você escolhe com qual arma atacar.") : ""}</p>` : ""}
    </div>
  <div class="sheet"><h3>Armadura</h3><div class="slots">${armor}</div>${eq && eq!=="weapon" && !/^off/.test(eq) ? eqActs : ""}${wearing(/^Chapéu do Bobo/) ? `<p class="muted small">Com o Chapéu do Bobo você não consegue Mover em Silêncio.</p>` : ""}</div>
  <div class="sheet">
    ${foldHead("bag", "Mochila", h.bag.length ? bagTools() : "")}
    ${isFolded("bag") ? "" : `${bag || (bf && h.bag.length ? `<p class="muted small">Nenhum item de ${bf.n.toLowerCase()} na mochila.</p>` : `<p class="muted small">Vazia. Itens encontrados nas masmorras aparecem aqui.</p>`)}
    ${h.provisions ? `<div class="row" style="align-items:center;justify-content:space-between"><p class="small">Provisões: ${N(h.provisions)}</p>${raceT("fungo") ? `<button class="use" data-act="eat">Comer (1d6 PV)</button>` : ""}</div>` : ""}`}
  </div>
  ${spells.length ? `<div class="sheet">${foldHead("spells","Magias")}${isFolded("spells") ? "" : `${state.ui.recharge ? `<div class="sheet dashed" style="padding:10px"><p class="small">Recarregar Mana: escolha a magia que recupera 1 uso.</p><div class="dlist">${rechargeable().map(n=>`<button class="dbtn" data-act="rechargeOut" data-n="${esc(n)}">${n} ${h.spells[n].left}/${h.spells[n].max}</button>`).join("")}</div><button class="btn ghost" data-act="rechargeOutCancel">Cancelar</button></div>` : ""}${state.ui.stonePick ? `<div class="sheet dashed" style="padding:10px"><p class="small">Armadura de Pedra: escolha a peça que a magia vai criar (5 PV).</p><div class="dlist">${freeSlots().map(sl=>`<button class="dbtn" data-act="stoneOut" data-s="${sl}">${sl}</button>`).join("")}</div><button class="btn ghost" data-act="stoneOutCancel">Cancelar</button></div>` : ""}${h.shield ? `<p class="small">Escudo Mágico ativo: absorve ${h.shield} de dano.</p>` : ""}${spellHTML}<p class="muted small">Magias gastas voltam ao descansar na cidade.</p>`}</div>` : ""}
  ${(()=>{ const x = H(h), kills = Object.entries(x.kills).sort((a,b)=>b[1]-a[1]);
    const lost = state.cemetery.filter(g=>!g.retired && g.name!==h.name).length;
    const best = Object.entries(x.sets).sort((a,b)=>b[1].length-a[1].length)[0];
    const line = (k,v) => `<span>${k}</span><b>${v}</b>`;
    if(isFolded("hist")) return `<div class="sheet">${foldHead("hist","Histórico")}</div>`;
    return `<div class="sheet">${foldHead("hist","Histórico")}
    <div class="hist">
      ${line("Monstros abatidos", N(x.total))}
      ${kills.map(([n,q])=>`<span class="small" style="padding-left:12px">${esc(n)}</span><b class="small">${N(q)}</b>`).join("")}
      ${line("Chefes derrotados", N(x.bosses))}
      ${line("Masmorras concluídas", N(x.dungeons))}
      ${line("Fechaduras abertas", N(x.locks))}
      ${line("Itens vendidos", N(x.sold))}
      ${line("Magias e pergaminhos usados", N(x.magic))}
      ${line("Magias conhecidas", N(knownSpells(h).length))}
      ${line("Armaduras destruídas", N(x.armorLost))}
      ${line("Combates com mortos-vivos", N(x.undead))}
      ${line("Cadáveres de aventureiros revistados", N(x.avenged))}
      ${line("Aventureiros perdidos", N(lost))}
      ${line("Maior conjunto de armadura", best ? `${best[1].length}/6` : "0/6")}
    </div>
    ${best ? `<p class="muted small">Conjunto mais completo: ${esc(best[0])}.</p>` : ""}</div>`; })()}
  <div class="sheet">
    ${foldHead("adv","Vantagens")}
    ${isFolded("adv") ? "" : `<p class="adv"><b>${R(h.race).n}:</b> ${raceAdvHTML(R(h.race))}</p>
    ${h.race2 && R(h.race2) ? `<p class="adv"><b>${R(h.race2).n} (herdada):</b> ${raceAdvHTML(R(h.race2))}</p>` : ""}
    <p class="adv"><b>${CLASSES[h.cls].n}:</b> ${CLASSES[h.cls].adv}</p>
    ${(h.adv||[]).map(n=>`<p class="adv"><b>${n}:</b> ${ADV_BY_NAME[n].adv}${ADV_BY_NAME[n].how ? ` <span class="muted small">${ADV_BY_NAME[n].how}</span>` : ""}</p>`).join("")}`}
  </div>
  ${state.ui.confirmDeath ? `
    <div class="sheet dashed">
      <label class="label" for="deathCause">Causa da morte</label>
      <input type="text" id="deathCause" maxlength="60" placeholder="Ex.: Devorado por 4 Goblins">
      <div class="row"><button class="btn ghost" data-act="cancelDeath">Ainda não</button><button class="btn" data-act="die">Enterrar</button></div>
    </div>` : `<button class="btn ghost" data-act="askDeath">Registrar morte</button>`}`;
}
