/* masmorra: exploração */
function monCard(g){
  const groups = [g, ...(g.extra||[])];
  return groups.map(x=>`
    <div class="mon">
      <canvas class="monpic" width="48" height="40" data-mon="${esc(monKey(x))}" data-boss="${x.boss?1:0}"></canvas>
      <span class="who">${x.boss ? "Chefe: " : ""}${x.list.length>1 ? N(x.list.length)+" " : ""}${x.name}</span>
      <div class="stats"><span class="chip solid">${N(x.pv)} PV${x.list.length>1?" cada":""}</span><span class="chip">Dano ${N(x.dano)}</span></div>
      ${x.tr ? `<div class="traits">${x.tr.split(", ").map(t=>`<span class="chip">${t}</span>`).join("")}</div>` : ""}
    </div>`).join("");
}
function viewExplore(){
  const d = state.dungeon, h = state.hero;
  if(!d || !d.inside || !h) return viewSheet();
  const lv = LV(), seg = curSeg();
  const isBlocked = blocked(seg);
  const acts = [];
  const msg = state.ui.msg; state.ui.msg = null;
  const tele = state.ui.tele;

  // monstros
  let monHTML = "";
  if(seg.mon){
    const g = seg.mon;
    const who = g.sneak ? "Eles ainda não te viram." : g.boss ? "Você encontrou o Chefe da Masmorra. Você ataca primeiro." : g.first === "hero" ? "Você ataca primeiro." : g.broke ? "Você quebrou a porta e fez barulho. Os monstros atacam primeiro." : "Os monstros te viram. Eles atacam primeiro.";
    monHTML = `<div class="stack" style="gap:8px">${monCard(g)}<p class="small">${who}</p>
</div>`;
    if(isBlocked){
      if(raceT("coutim") && !g.boss && [g, ...(g.extra||[])].every(x=>/Espólios/.test(x.tr||""))) acts.push(`<button class="btn ghost" data-act="coutim">Ignorar o combate e pegar os espólios</button>`);
      if(g.first==="hero" && !g.sneakTried && !g.boss && !seg.final && !wearing(/^Chapéu do Bobo/) && !raceT("noSneak")) acts.push(`<button class="btn ghost" data-act="sneak">Mover em Silêncio <small>(1 tocha)</small></button>`);
      acts.unshift(`<button class="btn" data-act="fight">Lutar!</button>`);
      acts.push(`<button class="btn ghost" data-act="go" data-to="sheet">Abrir ficha</button>`);
    } else acts.push(`<button class="btn ghost" data-act="fight" data-surprise="1">Atacar de surpresa</button>`);
  }

  // portas
  const closed = seg.doors.map(id=>lv.doors[id]).filter(dd=>dd.st==="closed"||dd.st==="locked");
  const selDoor = state.ui.selDoor && lv.doors[state.ui.selDoor];
  let popHTML = "";
  let doorsHTML = "";
  if(!isBlocked && closed.length){
    const count = {};
    doorsHTML = `<span class="label">Portas fechadas</span><div class="dlist">${closed.map(dd=>{
      count[dd.dir] = (count[dd.dir]||0)+1;
      const same = closed.filter(o=>o.dir===dd.dir).length;
      const lab = `Porta ${DIRNAME[dd.dir]}${same>1?" "+count[dd.dir]:""}${dd.st==="locked"?" (trancada)":""}${isBossDoor(lv, dd)?" · Chefe":""}`;
      return `<button class="dbtn ${selDoor&&selDoor.id===dd.id?"sel":""}" data-act="selDoor" data-id="${dd.id}">${lab}</button>`;
    }).join("")}</div>`;
    if(selDoor && selDoor.seg===seg.id){
      const chav0 = hasClass("Chaveiro") || hasClass("Ladrão");
      popHTML = selDoor.st==="closed"
        ? `<button class="pbtn" data-act="openDoor" data-id="${selDoor.id}">Abrir porta <small>(1 tocha)</small></button>`
        : `<button class="pbtn" data-act="unlock" data-how="pick" data-id="${selDoor.id}">Destrancar <small>(${chav0?"sem tocha":"+1 tocha"})</small></button>
           <button class="pbtn alt" data-act="unlock" data-how="break" data-id="${selDoor.id}">Quebrar</button>
           ${keyIdx() >= 0 ? `<button class="pbtn alt" data-act="unlock" data-how="key" data-id="${selDoor.id}">Chave</button>` : ""}`;
      if(isBossDoor(lv, selDoor)){ popHTML = `<span class="pwarn">O Chefe está atrás desta porta</span>` + popHTML; acts.push(`<p class="note">Esta é a última porta do nível e não há escada para descer. Ao abri-la, você entra na Sala Final e enfrenta o Chefe da Masmorra.</p>`); }
      if(selDoor.st==="closed") acts.push(`<button class="btn" data-act="openDoor" data-id="${selDoor.id}">Abrir porta <small>(1 tocha)</small></button>`);
      else {
        const chav = hasClass("Chaveiro") || hasClass("Ladrão");
        acts.push(`<button class="btn" data-act="unlock" data-how="pick" data-id="${selDoor.id}">Destrancar <small>(${chav?"sem tocha extra":"+1 tocha"})</small></button>`);
        acts.push(`<button class="btn ghost" data-act="unlock" data-how="break" data-id="${selDoor.id}">Quebrar porta <small>(faz barulho)</small></button>`);
        if(keyIdx() >= 0) acts.push(`<button class="btn ghost" data-act="unlock" data-how="key" data-id="${selDoor.id}">Usar chave</button>`);
      }
    }
  }
  if(!isBlocked){
    if(seg.loot) acts.push(`<button class="btn" data-act="loot">Pegar: ${lootText(seg.loot)}</button>`);
    if(seg.stash && seg.stash.length && !state.ui.bagFull) acts.push(`<button class="btn" data-act="takeStash">Itens deixados aqui (${seg.stash.length})</button>`);
    if(seg.chests>0) acts.push(`<button class="btn" data-act="chest">Abrir baú</button>`);
    if(seg.secret && !seg.secretTried) acts.push(`<button class="btn ghost" data-act="secret">Procurar passagem secreta <small>(1 tocha)</small></button>`);
    if(seg.k==="room" && !seg.disarmed && !seg.final) acts.push(seg.trapSeen
      ? `<button class="btn ghost" data-act="disarm">Desarmar armadilhas <small>(1 tocha)</small></button>`
      : `<button class="btn ghost" disabled>Desarmar armadilhas <small>(nenhuma armadilha à vista)</small></button>`);
    if(d.corpses.some(c=>c.level===d.pos.level && c.seg===seg.id)) acts.push(`<button class="btn" data-act="corpse">Revistar cadáver</button>`);
    if(seg.gosma && raceT("gosma")) acts.push(`<button class="btn" data-act="engulf">Engolfar um corpo <small>(recupera todos os PV)</small></button>`);
    if(seg.down) acts.push(`<button class="btn" data-act="descend">${d.pos.level+1>=3 ? "Descer para a Sala Final" : `Descer para o nível ${d.pos.level+1}`}</button>`);
    if(seg.up) acts.push(`<button class="btn ghost" data-act="climb">Subir para o nível ${seg.up.level}</button>`);
  }
  let banner = "";
  const bdoor = !d.complete && bossDoorOf(lv);
  if(bdoor && !isBlocked){
    const here = bdoor.seg === seg.id;
    banner = `<div class="banner"><b>A última porta guarda o Chefe</b>
      <p class="small">Não há escada para descer neste nível. ${here ? "A porta que resta aqui" : `A porta que resta (em ${esc(lv.segs[bdoor.seg].name.toLowerCase())})`} leva direto à Sala Final: ao abri-la, você enfrenta o Chefe da Masmorra. Prepare-se antes, ou procure passagens secretas.</p></div>`;
  }
  if(d.complete){
    banner = `<div class="banner"><b>Masmorra completada!</b><p>${esc(d.name)} foi vencida. Pegue os tesouros e volte para a cidade.</p></div>`;
  } else if(!isBlocked && levelExhausted(lv)){
    const last = lv.segs[lv.last];
    banner = `<div class="banner"><b>Não há mais portas neste nível</b>
      <p>Sem escadaria para o terceiro nível, a última sala aberta (${esc(last.name.toLowerCase())}) se torna a Sala Final. Procure passagens secretas antes, se quiser.</p>
      <button class="btn" data-act="lastFinal">Revelar o Chefe</button></div>`;
  }
  if(!isBlocked && seg.stash && seg.stash.length && state.ui.bagFull){
    const h2 = state.hero, cap = bagMax();
    if(state.ui.pick){
      const p = state.ui.pick, cnt = Object.values(p).filter(Boolean).length;
      const row = (key, it) => `<button class="opt ${p[key]?"on":""}" data-act="togglePick" data-k="${key}"><b>${esc(it.n.split(" (")[0])}</b><span>${esc((it.n.match(/\((.*)\)/)||[])[1]||(it.weapon?"Dano "+it.d:it.slot?it.pv+" PV":""))}</span></button>`;
      banner = `<div class="sheet"><h3>Selecionar itens</h3>
        <p class="small">Marque o que vai levar. Cabem ${N(cap)} itens; você marcou ${N(cnt)}. O que ficar desmarcado será descartado.</p>
        <span class="label">Na mochila</span>${h2.bag.map((it,i)=>row("b"+i,it)).join("") || `<p class="muted small">Vazia.</p>`}
        <span class="label">Encontrados</span>${seg.stash.map((it,i)=>row("s"+i,it)).join("")}
        <div class="row"><button class="btn ghost" data-act="cancelPick">Voltar</button><button class="btn" data-act="confirmPick" ${cnt>cap?"disabled":""}>Levar ${cnt}</button></div>
        ${cnt>cap ? `<p class="toast">Desmarque ${cnt-cap} ite${cnt-cap>1?"ns":"m"} para caber.</p>` : ""}</div>`;
    } else {
      banner = `<div class="banner"><b>Mochila cheia</b>
        <p>Você achou: ${esc(seg.stash.map(it=>it.n.split(" (")[0]).join("; "))}. Sua mochila tem ${h2.bag.length} de ${cap} itens.</p>
        <button class="btn" data-act="startPick">Selecionar itens</button>
        <button class="btn" data-act="later">Deixar para depois</button></div>`;
    }
  }
  const canLeave = !isBlocked && pathClear();
  return `
  <div class="bar"><button class="back" data-act="go" data-to="sheet" aria-label="Ficha">◀</button><h2 class="sm">${esc(d.name)}<br><span class="label">Nível ${N(d.pos.level)}</span></h2></div>
  <p class="muted small" style="margin:0">Toque numa porta ou sala. Arraste para mover e pince para dar zoom.</p>
  <div class="mapbox">
    <div class="maphud"><span>PV<b class="${lvc(h.pv,h.pvMax)}">${h.pv}/${h.pvMax}</b></span><span>Tochas<b class="${lvc(h.torches,10)}">${h.torches}</b></span><span>Moedas<b>${h.coins}</b></span><span>Mochila<b>${bagLabel(h)}</b></span></div>
    ${h.velas ? `<div class="mapbuff"><canvas width="5" height="8" data-candle></canvas>Vela · ${velaTxt(h.velas)}</div>` : ""}
    <canvas id="map" data-anim="map" aria-label="Mapa da masmorra visto de cima"></canvas>
 ${popHTML && !tele ? `<div class="doorpop" id="doorpop" data-door="${selDoor.id}">${popHTML}</div>` : ""}
    <div class="mapctl"><button data-act="zoom" data-z="1.3" aria-label="Aproximar">+</button><button data-act="zoom" data-z="0.77" aria-label="Afastar">−</button><button data-act="center" aria-label="Centralizar no aventureiro">◎</button><button data-act="go" data-to="sheet" aria-label="Ficha do personagem"><canvas width="13" height="13" data-clip></canvas></button></div>
  </div>
  <div class="etray" id="etray"></div>
  ${msg ? `<p class="toast">${esc(msg)}</p>` : ""}
  ${tele ? `<div class="sheet">
    <h3>Teletransporte</h3>
    <p class="small">Toque no mapa numa sala que você já visitou. Ou vá direto para a saída da masmorra.</p>
    <div class="stack">
      ${!(d.pos.level===1 && seg.exit) ? `<button class="btn" data-act="teleExit">Ir para a saída da masmorra</button>` : ""}
      <button class="btn ghost" data-act="teleCancel">Cancelar</button>
    </div></div>` : `${banner}
  <div class="sheet">
    <div class="seg-title"><h3>${esc(seg.name)}</h3>${seg.disarmed?`<span class="chip">desarmado</span>`:""}</div>
    ${seg.desc ? `<p>${esc(seg.desc)}</p>` : ""}
    ${seg.secret && !seg.secretTried ? `<p class="small muted">Pode ter Passagem Secreta.</p>` : ""}
    ${monHTML}
    ${doorsHTML}
    ${acts.length ? `<div class="stack">${acts.join("")}</div>` : (!closed.length && !seg.mon ? `<p class="muted small">Nada para fazer aqui. Toque em outra sala no mapa para andar até ela.</p>` : "")}
  </div>
  ${canLeave ? `<button class="btn ghost" data-act="leave">Sair para a cidade</button>` : ""}`}
  <div class="sheet"><h3>Diário</h3><div class="log">${d.log.slice(0,8).map(l=>`<p>${esc(l)}</p>`).join("")}</div></div>`;
}

/* cidade */
function sellValue(it){
  const h = state.hero;
  let v;
  if(/2d6×10/.test(it.n)) v = rollExpr("2d6")*10;
  else { const m = it.n.match(/vale (\d+) moedas/); v = m ? +m[1] : it.magic ? Math.max(0, d6()-1) : 1; }
  if(raceT("catSell") && (it.weapon || it.slot)) v *= 2;
  if(hasClass("Colecionador") && it.slot) v = Math.max(v, 5);
  if(hasClass("Comerciante")) v *= 2;
  return v;
}
/* descansar só faz sentido se faltar PV ou uso de magia (não conserta armadura) */
function needRest(h){ return h.pv < h.pvMax || Object.values(h.spells||{}).some(s=>s.left < s.max); }
function viewCity(){
  const h = state.hero, d = state.dungeon;
  if(!h) return viewTitle();
  if(mustRetire(h)) return `
  ${bar("Cidade","title")}
  <div class="banner"><b>Fim da jornada de ${esc(h.name)}</b>
    <p>Apesar de sua bravura, os ferimentos são irreparáveis. ${esc(h.name)} encerra aqui sua carreira de explorador.</p>
    <p>Mas ainda existe uma esperança...</p>
    <p class="small">O próximo aventureiro herda os itens, as armas e as armaduras de ${esc(h.name)}, consertadas. As moedas ficam para trás.</p>
    <button class="btn" data-act="retire">Passar o legado adiante</button></div>`;
  const broken = ARMOR_SLOTS.filter(s=>h.armor[s] && h.armor[s].cur !== undefined && h.armor[s].cur < h.armor[s].pv);
  return `
  ${bar("Cidade","sheet")}
  <div class="strip"><span>PV<b class="${lvc(h.pv,h.pvMax)}">${h.pv}/${h.pvMax}</b></span><span>Tochas<b class="${lvc(h.torches,10)}">${h.torches}</b></span><span>Moedas<b>${h.coins}</b></span></div>
  <div class="sheet">
    <h3>Taverna e mercado</h3>
    ${!needRest(h) ? `<p class="muted small">PV e magias estão completos: não há por que descansar.</p>` : ""}
    <button class="btn" data-act="rest" ${(h.coins<1&&!hasClass("Campeão")) || !needRest(h) ?"disabled":""}>Descansar <small>(${hasClass("Campeão")?"de graça, Campeão":"1 moeda"}: todos os PV e magias)</small></button>

   COMBATE (página 10 do livro)

const ABILITIES = ["Explosivo","Fogo","Horda","Magia","Morte Súbita","Necromancia","Regeneração","Paralisar"];
let fxPops = [], heroHitUntil = 0, monHit = {}, monAtk = {}, monDie = {};
const C = () => state.combat;
const alive = () => C().units.filter(u=>u.pv>0);
const has = (u, t) => (u.tr||"").includes(t);
function cLog(m){ const c = C(); c.log.unshift(m); if(c.log.length>30) c.log.length = 30; log(m); }
function pop(i, txt, col){ fxPops.push({i, txt, col, t0:performance.now()}); }

function startCombat(surprise){
  const seg = curSeg(), groups = [seg.mon, ...(seg.mon.extra||[])];
  const units = [];
  groups.forEach((g,gi)=>g.list.forEach(m=>units.push({key:monKey(g), name:monKey(g), pv:m.pv, max:m.max, dano:g.dano, tr:g.tr||"", boss:!!g.boss, g:gi})));
  const first = surprise || seg.mon.sneak || seg.mon.first === "hero" ? "hero" : "mon";
  if(seg.mon.sneak){ seg.mon.sneak = false; }
  state.combat = {level:D().pos.level, seg:seg.id, units, sel:0, phase:first, round:1, log:[], fury:0, heroPar:0, pending:null, alloc:{}, hits:0};
  if(units.some(u=>has(u,"Morto-Vivo"))) H().undead++;
  fxPops = []; monHit = {}; monAtk = {}; monDie = {};
  cLog(first === "hero" ? "O combate começa. Você ataca primeiro." : "O combate começa. Os monstros atacam primeiro.");
  go("combat");
  if(first === "mon") runMonsterTurn();
}
function heroDamageBonus(u, W){
  const h = state.hero; let b = 0; W = W || h.weapon;
  const wm = (W.n || "").match(/causa \+(\d) de dano(?! contra)/); if(wm) b += +wm[1];
  if(/contra Anjos/.test(W.n) && /Anjo/.test(u.name)) b += 2;
  if(/contra Vampiro e Carniçal/.test(h.bag.map(i=>i.n).join("|")) && /Vampir|Carniçal/.test(u.name)) b += 1;
  ARMOR_SLOTS.forEach(s=>{ const p = h.armor[s]; if(p && /da Força/.test(p.n)) b += +((p.n.match(/causará \+(\d)/)||[])[1] || 1); });
  if(ARMOR_SLOTS.some(s=>h.armor[s] && /Escamas/.test(h.armor[s].n)) && /Serpente/.test(u.name)) b += 1;
  if(hasClass("Coveiro") && has(u,"Morto-Vivo")) b += 2;
  if(hasClass("Helsing") && /Vampir|Carniçal/.test(u.name)) b += 1;
  if(hasClass("Dedetizador") && RX_INSETO.test(u.name)) b += 1;
  if(raceT("ogro")) b += 2;
  b += C().fury;
  return b;
}
/* aplica dano num monstro com as regras de Corpo de Pedra, Intangível e Ponto Fraco */
async function hitMonster(i, base, opts){
  const c = C(), u = c.units[i]; opts = opts || {};
  let dmg = Math.max(0, base);
  if(has(u,"Ponto Fraco") && opts.die === 6){ dmg *= 2; cLog(`Ponto fraco! O dano dobra.`); }
  const W = opts.w || state.hero.weapon;
  if(/Matador de Dragões/.test(W.n) && /Dragão/.test(u.name) && !opts.spell) dmg *= 2;
  if(has(u,"Corpo de Pedra") && dmg <= 3){ cLog(`${u.name} ignora ${dmg} de dano com o corpo de pedra.`); dmg = 0; }
  if(has(u,"Intangível") && dmg % 2 === 0 && dmg > 0 && !(/Remo do Barqueiro/.test(W.n) && !opts.spell) && !(hasClass("Caça-Fantasma") && opts.firstHit)){ cLog(`O golpe atravessa ${u.name}: dano par não afeta seres intangíveis.`); dmg = 0; }
  if(opts.vorpal){ dmg = u.pv; cLog(`Vorpal! ${u.name} morre na hora.`); }
  u.pv = Math.max(0, u.pv - dmg);
  monHit[i] = performance.now() + 300;
  pop(i, dmg ? "-"+dmg : "0", dmg ? "#fce870" : "#9aa6c4");
  if(dmg) cLog(`${u.name} sofre ${dmg} de dano${u.pv>0 ? ` (${u.pv}/${u.max} PV)` : ""}.`);
  if(u.pv <= 0){
    monDie[i] = performance.now();
    cLog(`${u.name} foi derrotado.`);
    if(has(u,"Morto-Vivo")){
      const [r] = await roll(`${u.name}: Morto-Vivo`, 1);
      rollNote(r === 1 ? "Levanta de novo!" : "Fica no chão");
      if(r === 1){ u.pv = 1; cLog(`${u.name} se levanta de novo com 1 PV!`); pop(i, "+1", "#6af06a"); }
    }
    if(u.pv <= 0 && !u.counted){ u.counted = true; recordKill(u); }
  }
}
function pickNextTarget(){ const c = C(); if(c.units[c.sel] && c.units[c.sel].pv > 0) return; const i = c.units.findIndex(u=>u.pv>0); if(i>=0) c.sel = i; }
async function afterHeroAction(){
  const c = C();
  if(!alive().length){ c.phase = "won"; cLog("Todos os monstros foram derrotados!"); busy = false; persist(); render(); return; }
  pickNextTarget();
  await runMonsterTurn();
}
function dualAttack(h){ return attacksPerTurn(h) > 1; }
async function heroAttack(kind, wn){
  const c = C(), h = state.hero, u = c.units[c.sel];
  if(!u || u.pv<=0) return;
  busy = true; rollLog = []; lockButtons(); const tr = $("#etray"); if(tr) tr.innerHTML = "";
  const W = typeof wn === "number" && offs(h)[wn] && !offs(h)[wn].shield ? offs(h)[wn] : h.weapon;
  const expr = kind === "horn" ? "1d6" : W.d;
  const [die] = await roll(kind === "horn" ? "Chifre" : "Ataque", 1);
  const mod = +((expr.match(/([+-]\d+)$/)||[])[1] || 0);
  const firstHit = !c.hits; c.hits = (c.hits||0) + 1;
  let base = die + mod + heroDamageBonus(u, W);
  const vorpal = /Vorpal/.test(W.n) && die === 6 && kind !== "horn";
  cLog(`Você ${kind==="horn" ? "dá uma chifrada" : "ataca com " + W.n.split(" (")[0]}: ${die}${mod?(mod>0?"+":"")+mod:""}${heroDamageBonus(u, W)?" +"+heroDamageBonus(u, W):""} = ${Math.max(0,base)}.`);
  if(firstHit && hasClass("Assassino") && base > 0){ base *= 3; cLog(`Assassino: o primeiro golpe causa o triplo (${base}).`); }
  await hitMonster(c.sel, base, {die, vorpal, w:W, firstHit});
  if(/Vampírica/.test(W.n) && kind !== "horn"){ h.pv = Math.min(h.pvMax, h.pv+1); cLog("A arma vampírica te devolve 1 PV."); }
  if(die === 1 && raceT("goblin")){
    const self = Math.max(0, 5 - (hasClass("Goblinator") ? 2 : 0));
    cLog("Você tirou 1 e explode! 5 de dano em todos da sala.");
    for(let i=0;i<c.units.length;i++) if(c.units[i].pv>0) await hitMonster(i, 5, {spell:true});
    h.pv = Math.max(0, h.pv - self); heroHitUntil = performance.now() + 450; cLog(`A explosão te causa ${self} de dano (${h.pv}/${h.pvMax}).`);
    if(h.pv <= 0){ finishDeath("Explodiu como um bom goblin"); return; }
  }
  if(die === 1 && raceT("semideus")){
    h.pv = Math.max(0, h.pv - 3); heroHitUntil = performance.now() + 450; cLog(`Semi-deus: o 1 no dado te custa 3 PV (${h.pv}/${h.pvMax}).`);
    if(h.pv <= 0){ finishDeath("A fúria dos deuses"); return; }
  }
  if(die === 1 && raceT("keyroz") && alive().length){ cLog("Keyroz: você tirou 1 e desaparece do combate!"); fleeCombat(); return; }
  if(kind !== "horn" && c.chain && c.chain.length && alive().length){
    pickNextTarget(); busy = false; persist(); render(); return;
  }
  c.chain = null;
  await afterHeroAction();
}
/* magias: quando dá para usar */
function rechargeable(){ const h = state.hero; return Object.entries(h.spells).filter(([n,s])=>n!=="Recarregar Mana" && s.left < s.max).map(([n])=>n); }
function freeSlot(){ const h = state.hero; return ARMOR_SLOTS.find(sl=>!h.armor[sl]); }
function canCast(n, inCombat){
  const i = SPELL_INFO[n], d = state.dungeon, inDg = d && d.inside; if(!i || i.use === "soon") return false;
  if(n === "Recarregar Mana" && !rechargeable().length) return false;
  if(n === "Armadura de Pedra" && (!freeSlot() || raceT("noArmor") || raceT("ogro"))) return false;
  if(inCombat) return true;
  if(i.use === "combat") return false;
  if(i.use === "dg") return !!inDg;
  return true;
}
function freeSlots(){ const h = state.hero; return ARMOR_SLOTS.filter(sl=>!h.armor[sl]); }
function stoneArmor(sl){
  const h = state.hero; if(!sl || h.armor[sl]) return null;
  h.armor[sl] = {n:`${sl} de Pedra (some ao sair da masmorra)`, slot:sl, pv:5, cur:5, stone:true};
  return sl;
}
async function heroSpell(n){
  const c = C(), h = state.hero, s = h.spells[n];
  if(!s || s.left<=0) return;
  if(n === "Recarregar Mana"){ c.recharge = true; render(); return; }
  if(n === "Armadura de Pedra"){ c.stonePick = true; render(); return; }
  busy = true; rollLog = []; lockButtons(); const tr = $("#etray"); if(tr) tr.innerHTML = "";
  s.left--; H().magic++;
  const u = c.units[c.sel];
  if(n === "Cura"){ h.pv = Math.min(h.pvMax, h.pv+5); cLog("Você conjura Cura e recupera 5 PV."); heroHitUntil = 0; }
  if(n === "Cura Natural"){ h.pv = Math.min(h.pvMax, h.pv+12); cLog("Você conjura Cura Natural e recupera 12 PV."); heroHitUntil = 0; }
  if(n === "Luz"){ h.torches = Math.min(10, h.torches+1); cLog("Você conjura Luz. O globo vale como uma tocha."); }
  if(n === "Relâmpago"){ cLog(`Relâmpago em ${u.name}!`); await hitMonster(c.sel, 6, {spell:true}); }
  if(n === "Rajada Mágica"){ cLog(`Rajada Mágica em ${u.name}!`); await hitMonster(c.sel, 12, {spell:true}); }
  if(n === "Raio de Gelo"){ cLog(`Raio de Gelo em ${u.name}! Ele não ataca no próximo turno.`); await hitMonster(c.sel, 4, {spell:true}); u.frozen = Math.max(u.frozen||0, 1); }
  if(n === "Bola de Fogo"){ cLog("Bola de Fogo em todos os inimigos da sala!"); for(let i=0;i<c.units.length;i++) if(c.units[i].pv>0) await hitMonster(i, 5, {spell:true}); }
  if(n === "Chuva de Insetos"){ cLog("Chuva de Insetos em todos os inimigos!"); for(let i=0;i<c.units.length;i++) if(c.units[i].pv>0) await hitMonster(i, 7, {spell:true}); }
  if(n === "Vimes"){ const [t] = await roll("Vimes", 1); u.frozen = Math.max(u.frozen||0, t); cLog(`Vimes prendem ${u.name}: ele fica ${t} turno${t>1?"s":""} sem atacar.`); }
  if(n === "Paralisar"){ alive().forEach(x=>x.frozen = Math.max(x.frozen||0, 2)); cLog("Paralisar: os monstros da sala ficam 2 turnos sem atacar."); }
  if(n === "Banir Mortos"){
    const und = c.units.map((x,i)=>({x,i})).filter(({x})=>x.pv>0 && has(x,"Morto-Vivo"));
    if(!und.length) cLog("Banir Mortos: não há mortos-vivos aqui.");
    und.forEach(({x,i})=>{ x.pv = 0; pop(i, "X", "#fce870"); cLog(`${x.name} é banido de volta ao túmulo.`); if(!x.counted){ x.counted = true; recordKill(x); } });
  }
  if(n === "Corpo Etéreo"){ c.ethereal = true; cLog("Corpo Etéreo: até o fim do combate, cada golpe que você receber causa 1 a menos."); }
  if(n === "Absorver Alma"){ c.absorb = true; cLog("Absorver Alma: depois do combate, você recupera 5 PV por monstro morto."); }
  if(n === "Fogo dos Mortos"){ c.deadFire = true; cLog("Fogo dos Mortos: depois do combate, você ganha 2 tochas por monstro morto."); }
  if(n === "Escudo Mágico"){ h.shield = (h.shield||0) + 4; cLog(`Escudo Mágico: ele absorve os próximos ${h.shield} de dano.`); }
  if(n === "Criar Comida"){ const v = await roll("Comida", 2); h.provisions = (h.provisions||0) + v[0]+v[1]; cLog(`Criar Comida: ${v[0]+v[1]} provisões.`); }
  if(n === "Teletransporte"){ cLog("Você se teletransporta para fora do combate."); fleeCombat(); return; }
  await afterHeroAction();
}
async function heroItem(idx){
  const c = C(), h = state.hero, it = h.bag[idx];
  if(!it || raceT("ogro")) return;
  if(/^Pergaminho/.test(it.n)) H().magic++;
  busy = true; lockButtons();
  if(/^Poção de Vida/.test(it.n)){ h.pv = h.pvMax; cLog("Você bebe a Poção de Vida e recupera todos os PV."); }
  else if(/^Poção da Fúria/.test(it.n)){ c.fury = 2; cLog("Você bebe a Poção da Fúria: +2 de dano até o fim do combate."); }
  else if(/^Poção de Magia/.test(it.n)){ Object.values(h.spells).forEach(s=>s.left=s.max); cLog("Você bebe a Poção de Magia e recupera todas as magias."); }
  else if(/^Pergaminho Mágico \((.+)\)/.test(it.n)){
    const sp = it.n.match(/\((.+)\)/)[1]; h.bag.splice(idx,1);
    const had = !!h.spells[sp], prevMax = had ? h.spells[sp].max : 0;
    if(had) h.spells[sp].left++; else h.spells[sp] = {max:1, left:1};
    cLog(`Você lê o Pergaminho de ${sp}.`); busy = false;
    await heroSpell(sp);
    if(state.hero){ if(!had) delete state.hero.spells[sp]; else if(state.hero.spells[sp]) state.hero.spells[sp].max = prevMax; persist(); }
    return;
  }
  h.bag.splice(idx,1);
  c.showItems = false;
  await afterHeroAction();
}
async function runMonsterTurn(){
  const c = C(), h = state.hero;
  busy = true; c.phase = "mon"; render(); lockButtons();
  rollLog = []; const tr = $("#etray"); if(tr) tr.innerHTML = "";
  let total = 0, poison = 0;
  for(let i=0;i<c.units.length;i++){
    const u = c.units[i];
    if(u.pv <= 0) continue;
    if(u.frozen){ u.frozen--; cLog(`${u.name} está congelado e não ataca.`); continue; }
    if(u.doom){ cLog(`${u.name} desfere o golpe de Morte Súbita!`); 
      if(ARMOR_SLOTS.some(s=>h.armor[s] && /dos Deuses/.test(h.armor[s].n))){ cLog("A armadura dos Deuses te protege da Morte Súbita."); u.doom = false; }
      else { finishDeath(`Morte Súbita de ${u.name}`); return; } }
    let dmg = u.dano;
    if(u.fireNext){ u.fireNext = false; if(raceT("fireproof")) cLog(`${u.name} ataca envolto em fogo, mas você é imune.`); else { dmg += 10; cLog(`${u.name} ataca envolto em fogo: +10 de dano!`); } }
    if(u.magicNext){ dmg += u.magicNext; cLog(`A magia de ${u.name} soma ${u.magicNext} ao dano.`); u.magicNext = 0; }
    if(u.paralNext){ const [p] = await roll("Paralisia", 1); c.heroPar = p; u.paralNext = false; cLog(`${u.name} te paralisa por ${p} turno${p>1?"s":""}!`); }
    const abil = ABILITIES.filter(a=>has(u,a));
    let exploded = false;
    if(abil.length){
      const [r] = await roll(u.name, 1);
      if(r === 1){
        if(has(u,"Explosivo")){ dmg = u.pv; u.pv = 0; exploded = true; if(hasClass("Goblinator")) dmg = Math.max(0, dmg-2); cLog(`${u.name} explode causando ${dmg} de dano!`); }
        if(has(u,"Fogo")){ u.fireNext = true; cLog(`${u.name} pega fogo: o próximo ataque causa +10.`); }
        if(has(u,"Horda")){ c.units.push({key:"Orc", name:"Orc", pv:6, max:6, dano:3, tr:"", g:-1}); cLog("Horda! Um Orc entra na sala."); }
        if(has(u,"Magia")){ const [m] = await roll(`Magia de ${u.name}`, 1); u.magicNext = m; cLog(`${u.name} prepara uma magia: +${m} no próximo ataque.`); }
        if(has(u,"Morte Súbita")){ u.doom = true; cLog(`${u.name} prepara um golpe mortal. O próximo ataque dele vai te matar!`); }
        if(has(u,"Necromancia")){ c.units.push({key:"Esqueleto", name:"Esqueleto", pv:4, max:4, dano:1, tr:"Morto-Vivo", g:-1}); cLog("Necromancia! Um Esqueleto se levanta."); }
        if(has(u,"Regeneração")){ const before = u.pv; u.pv = Math.min(u.max, u.pv+6); if(u.pv>before){ cLog(`${u.name} se regenera (+${u.pv-before} PV).`); pop(i, "+"+(u.pv-before), "#6af06a"); } else cLog(`${u.name} tenta se regenerar, mas já está com os PV cheios.`); }
        if(has(u,"Paralisar")){ u.paralNext = true; cLog(`${u.name} prepara um golpe paralisante para o próximo ataque.`); }
      }
    }
    if(c.ethereal && dmg > 0) dmg -= 1;
    if(hasShield() && dmg > 0){ dmg = Math.max(0, dmg - shieldVal()); }
    if(has(u,"Veneno")) poison += dmg; else total += dmg;
    monAtk[i] = performance.now() + 320;
    if(!exploded) cLog(`${u.name} ataca: ${dmg} de dano${has(u,"Veneno") ? " de veneno" : ""}.`);
  }
  if(h.shield > 0 && total + poison > 0){
    let a = Math.min(h.shield, total); total -= a; let b2 = Math.min(h.shield - a, poison); poison -= b2;
    h.shield -= a + b2; cLog(`O Escudo Mágico absorve ${a+b2} de dano${h.shield ? ` (restam ${h.shield})` : ""}.`);
  }
  if(total + poison === 0){ startHeroTurn(); return; }
  const absorb = ARMOR_SLOTS.filter(s=>h.armor[s] && armorCur(h.armor[s]) > 0);
  if(total > 0 && absorb.length){
    c.pending = {total, poison}; c.alloc = {}; c.phase = "alloc";
    busy = false; persist(); render(); return;
  }
  applyHeroDamage({}, total, poison);
}
function armorCur(p){ return p.cur === undefined ? p.pv : p.cur; }
function applyHeroDamage(alloc, total, poison){
  const c = C(), h = state.hero;
  let absorbed = 0;
  Object.entries(alloc).forEach(([slot, a])=>{
    const p = h.armor[slot]; if(!p || !a) return;
    p.cur = armorCur(p) - a; absorbed += a;
    if(p.cur <= 0){ cLog(`${slot} (${p.n.split(" (")[0]}) foi destruído.`); if(!p.stone) H(h).armorLost++; delete h.armor[slot]; }
  });
  const toPV = total - absorbed + poison;
  h.pv = Math.max(0, h.pv - toPV);
  heroHitUntil = performance.now() + 450;
  if(absorbed) cLog(`A armadura absorveu ${absorbed} de dano.`);
  if(toPV) cLog(`Você perde ${toPV} PV (${h.pv}/${h.pvMax}).`);
  c.pending = null; c.alloc = {};
  if(h.pv <= 0){ const killer = alive()[0]; finishDeath(killer ? `Morto por ${killer.name}` : "Morto em combate"); return; }
  startHeroTurn();
}
async function startHeroTurn(){
  const c = C();
  c.round++;
  if(c.heroPar > 0){
    c.heroPar--; cLog(`Você está paralisado e perde o turno${c.heroPar ? ` (faltam ${c.heroPar})` : ""}.`);
    persist(); render();
    await new Promise(r=>setTimeout(r, 700));
    await runMonsterTurn(); return;
  }
  c.phase = "hero"; busy = false; persist(); render();
}
function finishDeath(cause){
  if(samambro()){ cLog("Você se levanta com 1 PV e continua lutando."); startHeroTurn(); return; }
  busy = false;
  state.combat = null;
  killHero(cause);
  persist(); render(); window.scrollTo(0,0);
}
function writeBackGroups(){
  const c = C(), lv = D().levels[c.level], seg = lv.segs[c.seg];
  if(!seg || !seg.mon) return;
  const groups = [seg.mon, ...(seg.mon.extra||[])];
  groups.forEach((g,gi)=>{ g.list = c.units.filter(u=>u.g===gi && u.pv>0).map(u=>({pv:u.pv, max:u.max})); g.qty = g.list.length; });
  const keep = groups.filter(g=>g.list.length);
  if(!keep.length){ seg.mon = null; return; }
  seg.mon = keep[0]; seg.mon.extra = keep.slice(1); seg.mon.first = "hero"; seg.mon.sneak = false;
}
function fleeCombat(){
  const c = C(), lv = D().levels[c.level], seg = lv.segs[c.seg];
  writeBackGroups();
  let dest = null;
  if(seg.from && lv.doors[seg.from]) dest = lv.doors[seg.from].seg;
  if(!dest) dest = (Object.values(lv.segs).find(s=>s.exit || s.up) || {}).id;
  state.combat = null; busy = false;
  if(dest){ D().pos.seg = dest; centerOn = true; }
  mapVersion++; go("explore");
}
async function winCombat(){
  const c = C(), h = state.hero;
  if(c && h){
    const dead = c.units.filter(u=>u.counted).length;
    if(c.absorb && dead){ h.pv = Math.min(h.pvMax, h.pv + 5*dead); log(`Absorver Alma: +${5*dead} PV.`); }
    if(c.deadFire && dead){ h.torches = Math.min(10, h.torches + 2*dead); log(`Fogo dos Mortos: +${2*dead} tochas.`); }
    if(raceT("gosma") && dead){ const sg = D().levels[c.level].segs[c.seg]; if(sg) sg.gosma = true; }
  }
  state.combat = null;
  go("explore");
  await doDefeat();
}

/* arena */
function drawArena(cv){
  const c = C(); if(!c) return;
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, t = frame/8, now = performance.now();
  const type = state.dungeon.type, P = PALZ[type], TX = texFor(type);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = VOID; ctx.fillRect(0,0,W,H);
  for(let y=34; y<H; y+=32) for(let x=0; x<W; x+=32) ctx.drawImage(TX.floors[Math.min(3, Math.floor(zh(x,y)*4))], x, y);
  ctx.drawImage(TX.face, 40, 0, W, 40, 0, 0, W, 40);
  for(let i=0;i<8;i++){ ctx.fillStyle = `rgba(0,0,0,${.45-i*.055})`; ctx.fillRect(0, 40+i, W, 1); }
  [[24,12],[W-26,12]].forEach(([x,y],i)=>{ ctx.fillStyle = IRON[1]; ctx.fillRect(x-3, y+7, 7, 2); ctx.fillStyle = WOOD[2]; ctx.fillRect(x-1, y+1, 3, 6); flameZ(ctx, x, y-1, t, i*2.1); });
  const units = c.units, pos = arenaPositions(units.length, W);
  units.forEach((u,i)=>{
    const [x, y] = pos[i];
    if(u.pv <= 0){
      // morte: pisca em branco, afunda e some
      const k = monDie[i] ? (now - monDie[i]) / 650 : 1;
      if(k >= 1) return;
      drawMonsterSprite(ctx, u.key, x, y + Math.round(k*6), t, frame, {alpha:1-k, still:true});
      if(k < .35) drawMonsterSprite(ctx, u.key, x, y + Math.round(k*6), t, frame, {white:true, alpha:.8*(1-k/.35), still:true});
      return;
    }
    if(i === c.sel && c.phase !== "won"){ const by = y - 30 + (frame%4<2?0:1); ctx.fillStyle = "#f8e048"; ctx.fillRect(x-3, by, 7, 1); ctx.fillRect(x-2, by+1, 5, 1); ctx.fillRect(x-1, by+2, 3, 1); ctx.fillRect(x, by+3, 1, 1); }
    if(u.boss){ const g = ctx.createRadialGradient(x, y-10, 2, x, y-10, 26); g.addColorStop(0,"rgba(255,80,60,.22)"); g.addColorStop(1,"rgba(255,80,60,0)"); ctx.fillStyle = g; ctx.fillRect(x-26, y-36, 52, 52); }
    const hit = monHit[i] && monHit[i] > now, shake = hit ? (frame%2 ? 1 : -1) : 0;
    // ataque: avança em direção ao herói e volta
    const ak = monAtk[i] && monAtk[i] > now ? 1 - (monAtk[i] - now)/320 : 0, lunge = ak ? Math.round(Math.sin(ak*Math.PI)*7) : 0;
    drawMonsterSprite(ctx, u.key, x + shake, y + lunge, t, frame);
    if(hit && monHit[i] - now > 140) drawMonsterSprite(ctx, u.key, x + shake, y + lunge, t, frame, {white:true, alpha:.75, still:true});
    if(u.frozen){ ctx.fillStyle = "rgba(160,220,255,.45)"; ctx.fillRect(x-10, y-22, 20, 22); }
    const bw = 20, f = u.pv/u.max;
    ctx.fillStyle = "#0c0a12"; ctx.fillRect(x-bw/2-1, y+4, bw+2, 4);
    ctx.fillStyle = f > .5 ? "#6ac04a" : f > .25 ? "#e0b038" : "#d83a2a"; ctx.fillRect(x-bw/2, y+5, Math.max(1, Math.round(bw*f)), 2);
  });
  // aventureiro de costas para a tela, no primeiro plano
  const hx = Math.round(W/2 - 8), hy = H - 26;
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+3, hy+21, 11, 3);
  ctx.save(); if(heroHitUntil > now && frame%2) ctx.globalAlpha = .4;
  drawSpriteC(ctx, HERO_Z, hx, hy, HERO_ZC);
  ctx.restore();
  ctx.fillStyle = WOOD[2]; ctx.fillRect(hx+15, hy+4, 2, 9); flameZ(ctx, hx+16, hy+2, t, 5);
  if(heroHitUntil > now){ ctx.fillStyle = "rgba(220,40,30,.25)"; ctx.fillRect(0,0,W,H); }
  const g = ctx.createRadialGradient(W/2, H-10, 20, W/2, H/2, W*.75);
  g.addColorStop(0, "rgba(4,6,12,0)"); g.addColorStop(1, "rgba(4,6,12,.5)");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  glowZ(ctx, hx+16, hy-4, 44, .2);
  // números de dano
  fxPops = fxPops.filter(p=>now - p.t0 < 1100);
  fxPops.forEach(p=>{
    const [x,y] = pos[p.i] || [W/2, H-30]; const k = (now - p.t0)/1100;
    ctx.save(); ctx.translate(Math.round(x - textW(p.txt.replace("-","").replace("+",""))), Math.round(y - 30 - k*14)); ctx.scale(2,2);
    drawText(ctx, p.txt.replace("-","").replace("+",""), 1, 1, "#0c0a12"); drawText(ctx, p.txt.replace("-","").replace("+",""), 0, 0, p.col);
    ctx.restore();
  });
}
function arenaPositions(n, W){
  const pos = [];
  const rows = n <= 4 ? [n] : n <= 8 ? [Math.ceil(n/2), Math.floor(n/2)] : [Math.ceil(n/3), Math.ceil(n/3), n - 2*Math.ceil(n/3)];
  let k = 0;
  rows.forEach((cnt, r)=>{
    const y = 62 + r*18;
    for(let j=0;j<cnt;j++){ const x = Math.round(W/(cnt+1) * (j+1) + (r%2 ? 10 : 0)); pos[k++] = [x, y]; }
  });
  return pos;
}
function arenaTap(e){
  const c = C(); if(!c || busy || c.phase !== "hero") return;
  const cv = e.currentTarget, r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
  const pos = arenaPositions(c.units.length, cv.width);
  let best = -1, bd = 22;
  c.units.forEach((u,i)=>{ if(u.pv<=0) return; const d = Math.hypot(pos[i][0]-x, pos[i][1]-12-y); if(d < bd){ bd = d; best = i; } });
  if(best >= 0){ c.sel = best; persist(); render(); }
}

        ${state.ui.delGrave===i ? `<div class="sheet dashed" style="margin-top:8px;padding:10px"><p class="small">Apagar ${esc(g.name)} do Salão dos Heróis para sempre?</p>
          <div class="row"><button class="btn ghost" data-act="cancelDelGrave">Cancelar</button><button class="btn" data-act="delGrave" data-i="${i}">Apagar</button></div></div>` : ""}</div>
        <button class="xbox" data-act="askDelGrave" data-i="${i}" aria-label="Apagar ${esc(g.name)}">×</button></div>`; }).join("")
      : `<p class="muted">Nenhum nome no salão ainda. Por enquanto.</p>`}
  </div>`;
}

/* =========================================================
   RENDER E AÇÕES
   ========================================================= */
const VIEWS = {advclass:viewAdvClass, combat:viewCombat, settings:viewSettings, title:viewTitle, create:viewCreate, sheet:viewSheet, dungeon:viewDungeon, explore:viewExplore, city:viewCity, cemetery:viewCemetery, save:viewSave};
function render(){
  normalizeHands();
  if(state.screen==="create" && !state.draft) state.screen = "title";
  if(["sheet","dungeon","explore","city","advclass"].includes(state.screen) && !state.hero) state.screen = "title";
  if(state.screen==="explore" && !(state.dungeon && state.dungeon.inside)) state.screen = "sheet";
  if(state.screen==="combat" && !(state.combat && state.hero)) state.screen = state.hero && state.dungeon && state.dungeon.inside ? "explore" : "title";
  $("#app").innerHTML = (VIEWS[state.screen]||viewTitle)();
  const dr = state.draft;
  if(state.screen==="create" && dr){
    const tray = $("#tray");
    if(tray){
      if(dr.step==="race") fillTray(tray, dr.raceDice, true);
      else if(dr.step==="cls") fillTray(tray, dr.clsDice, true);
      else if(dr.step==="spells") fillTray(tray, dr.spells.length ? [dr.spells[dr.spells.length-1]] : null, false);
    }
  }
  if(state.screen==="dungeon" && state.dungeon){
    state.dungeon.dice.forEach((v,i)=>fillTray($("#t"+i),[v],false));
  }
  if(state.screen==="explore"){
    const tray = $("#etray");
    rollLog.forEach(r=>{
      const g = document.createElement("div"); g.className = "rg";
      g.innerHTML = `<div class="dice"></div><span class="label">${esc(r.label)}</span>${r.note ? `<span class="rnote">${esc(r.note)}</span>` : ""}`;
      r.vals.forEach(v=>g.querySelector(".dice").appendChild(dieCanvas(v)));
      tray.appendChild(g); r.el = g;
    });
    const cv = $("#map"); if(cv) bindMap(cv);
  }
  if(state.screen==="combat"){ const a = $("#arena"); if(a) a.addEventListener("click", arenaTap); }
  document.querySelectorAll("canvas[data-grave]").forEach(drawGrave);
  document.querySelectorAll("canvas[data-shield]").forEach(drawShield);
  document.querySelectorAll("canvas[data-gear]").forEach(drawGear);
  document.querySelectorAll("canvas[data-clip]").forEach(drawClip);
  document.querySelectorAll("canvas[data-candle]").forEach(drawCandle);
  paint();
}

const actions = {
  go(b){ const keep = state.ui.lastDeath && b.dataset.to==="cemetery"; state.ui = keep ? state.ui : {}; go(b.dataset.to); },
  newHero(){
    if(state.hero){ state.ui.confirmNew = true; render(); return; }
    startDraft();
  },
  cancelNew(){ state.ui = {}; render(); },
  retire(){
    const h = state.hero, d = state.dungeon; if(!h || !mustRetire(h)) return;
    const items = h.bag.map(it=>({...it}));
    [h.weapon, ...offs(h)].forEach(w=>{ if(w && !w.unarmed) items.push(wCopy(w)); });
    const armor = {};
    ARMOR_SLOTS.forEach(sl=>{ const p = h.armor[sl]; if(p){ armor[sl] = {...p}; armor[sl].cur = p.pv; } });
    state.cemetery.push({name:h.name, who:`${raceName(h)} ${classLabel(h)}`, where:d&&d.name, cause:"Aposentado: ferimentos irreparáveis", retired:true});
    state.legacy = {from:h.name, idx:state.cemetery.length-1, bag:items, armor};
    state.hero = null; state.ui = {};
    startDraft();
  },
  abandon(){
    const h = state.hero, d = state.dungeon;
    state.cemetery.push({name:h.name, who:`${raceName(h)} ${classLabel(h)}`, where:d&&d.name, cause:"Abandonado pelo jogador"});
    if(d && d.inside){ d.corpses.push({level:d.pos.level, seg:d.pos.seg, name:h.name, bag:h.bag, coins:h.coins}); d.inside = false; }
    state.hero = null; state.ui = {};
    startDraft();
  },
  async rollRace(){
    busy = true; lockButtons();
    const dr = state.draft, cat = dr.raceCat || "comum";
    const v = await rollInto($("#tray"), cat === "comum" || cat === "zoada" ? 2 : 1);
    dr.raceDice = v; dr.race2 = null; dr.spells = [];
    dr.race = cat === "comum" ? v[0]+v[1] : cat === "zoada" ? `z${v[0]}${v[1]}` : `${cat[0]}${v[0]}`;
    busy = false; persist(); render();
  },
  async rollRace2(){
    busy = true; lockButtons();
    const v = await rollInto($("#tray"), 2);
    state.draft.race2 = v[0]+v[1]; state.draft.spells = [];
    busy = false; persist(); render();
  },
  raceCat(b){ const dr = state.draft; if(dr.raceCat === b.dataset.k) return; dr.raceCat = b.dataset.k; dr.race = null; dr.race2 = null; dr.raceDice = null; dr.spells = []; persist(); render(); },
  async rollCls(){
    busy = true; lockButtons();
    const v = await rollInto($("#tray"), 2);
    state.draft.clsDice = v; state.draft.cls = v[0]+v[1]; state.draft.spells = [];
    busy = false; persist(); render();
  },
  afterCls(){ state.draft.step = needSpells(state.draft) ? "spells" : "name"; persist(); render(); },
  step(b){ state.draft.step = b.dataset.to; persist(); render(); },
  async rollSpell(){
    busy = true; lockButtons();
    const dr = state.draft, t = spellNeeds(dr)[dr.spells.length] || "basica";
    const v = await rollInto($("#tray"), SPELL_TABLES[t].dice);
    state.draft.spells.push({t, v: SPELL_TABLES[t].dice === 2 ? v[0]+v[1] : v[0]});
    busy = false; persist(); render();
  },
  randName(){
    const inp = $("#heroName");
    let n; do{ n = pick(HERO_NAMES); } while(n===inp.value);
    inp.value = n; state.draft.name = n; persist();
  },
  finish(){
    const dr = state.draft, inp = $("#heroName");
    const name = (inp.value||"").trim() || pick(HERO_NAMES);
    const r = R(dr.race), c = CLASSES[dr.cls], rx = raceStart(dr);
    const spells = {};
    Object.entries(buildSpells(dr)).forEach(([n,q])=>spells[n] = {max:q, left:q});
    state.hero = {name, race:dr.race, race2:dr.race2||null, cls:dr.cls, adv:[], pvMax:r.pv+c.pv, pv:r.pv+c.pv, torches:10, coins:rx.coins,
      weapon:{n:c.w, d:c.d}, armor:{}, bag:[], spells, arms:rx.arms, hist:{}};
    if(rx.gun){ state.hero.bag.push({n:c.w, weapon:true, d:c.d}); state.hero.weapon = {n:"Pistola Laser", d:"1d6+5"}; }
    H(state.hero);
    state.draft = null; state.ui = {};
    const lg = state.legacy;
    if(lg){
      state.hero.bag = lg.bag; state.hero.armor = lg.armor;
      const g = state.cemetery[lg.idx]; if(g && g.name === lg.from) g.heir = name;
      state.ui.legacyMsg = `${name} recebeu o legado de ${lg.from}: as armaduras já estão vestidas e as armas e os itens estão na mochila.`;
      state.legacy = null;
    }
    go(state.dungeon && !state.dungeon.complete ? "dungeon" : "sheet");
  },
  pv(b){ const h = state.hero; h.pv = Math.max(0, Math.min(h.pvMax, h.pv + +b.dataset.d)); persist(); render(); },
  torch(b){ const h = state.hero; h.torches = Math.max(0, Math.min(10, h.torches + +b.dataset.d)); persist(); render(); },
  coin(b){ const h = state.hero; h.coins = Math.max(0, h.coins + +b.dataset.d); persist(); render(); },
  cast(b){
    const h = state.hero, n = b.dataset.spell, s = h.spells[n];
    if(!s || s.left<=0) return;
    if(!canCast(n, false)) return;
    if(n === "Teletransporte"){ H().magic++; startTele("spell"); return; }
    if(n === "Recarregar Mana"){ state.ui.recharge = true; render(); return; }
    if(n === "Armadura de Pedra"){ state.ui.stonePick = true; render(); return; }
    s.left--; H().magic++;
    let msg = `Você usou ${n}.`;
    if(n==="Cura") h.pv = Math.min(h.pvMax, h.pv+5);
    if(n==="Cura Natural") h.pv = Math.min(h.pvMax, h.pv+12);
    if(n==="Luz") h.torches = Math.min(10, h.torches+1);
    if(n==="Escudo Mágico"){ h.shield = (h.shield||0) + 4; msg = `Escudo Mágico: absorve os próximos ${h.shield} de dano.`; }
    if(n==="Criar Comida"){ const q = rollExpr("2d6"); h.provisions = (h.provisions||0) + q; msg = `Criar Comida: ${q} provisões.`; }
    if(state.dungeon && state.dungeon.inside) log(msg); else state.ui.cityMsg = msg;
    persist(); render();
  },
  rechargeOut(b){
    const h = state.hero, rm = h.spells["Recarregar Mana"], n = b.dataset.n;
    if(!rm || rm.left<=0 || !h.spells[n]) return;
    rm.left--; H().magic++; h.spells[n].left = Math.min(h.spells[n].max, h.spells[n].left+1);
    state.ui.recharge = false;
    if(state.dungeon && state.dungeon.inside) log(`Recarregar Mana: ${n} recupera 1 uso.`);
    persist(); render();
  },
  rechargeOutCancel(){ state.ui.recharge = false; render(); },
  eat(){
    const h = state.hero; if(!raceT("fungo") || !(h.provisions>0)) return;
    h.provisions--; const v = d6(), before = h.pv; h.pv = Math.min(h.pvMax, h.pv+v);
    const msg = `Você comeu 1 provisão: o dado deu ${v} e você recuperou ${h.pv-before} PV.`;
    if(state.dungeon && state.dungeon.inside) log(msg); else state.ui.cityMsg = msg;
    persist(); render();
  },
  engulf(){
    const seg = curSeg(), h = state.hero; if(!seg.gosma || !raceT("gosma")) return;
    seg.gosma = false; h.pv = h.pvMax; log("Você engolfou o corpo de um inimigo e recuperou todos os PV."); persist(); render();
  },
  async coutim(){
    const seg = curSeg(); if(!raceT("coutim") || !seg.mon) return;
    log("Você evita o combate e ainda fica com os espólios.");
    await doDefeat();
  },
  bagSel(b){ const i = +b.dataset.i; state.ui.bagSel = state.ui.bagSel===i ? null : i; render(); },
  equip(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    if(raceT("noArmor") || raceT("ogro")) return;
    const old = h.armor[it.slot];
    h.armor[it.slot] = it; h.bag.splice(i,1);
    if(old) h.bag.push(old);
    state.ui.bagSel = null; persist(); render();
  },
  swapOff(b){
    const h = state.hero, i = +b.dataset.i, k = +b.dataset.k, it = h.bag[i], o = offs(h), cur = o[k];
    if(!it || !cur) return;
    const need = isShield(it) ? 1 : it.two ? 2 : 1;
    if(handsFree() - handsUsed() + handNeed(cur) < need) return;
    h.bag.splice(i,1); h.bag.push(wCopy(cur));
    o[k] = isShield(it) ? {n:it.n, shield:true} : {n:it.n, d:it.d, two:it.two, magic:it.magic};
    persist(); render();
  },
  wieldShield(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    if(!it || !isShield(it) || handsLeft() < 1) return;
    h.bag.splice(i,1);
    offs(h).push({n:it.n, shield:true});
    state.ui.bagSel = null; persist(); render();
  },
  wield(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    const need = it.two ? 2 : 1, nw = {n:it.n, d:it.d, two:it.two, magic:it.magic};
    if(handsFree() < need) return;
    if(b.dataset.s === "off" && !h.weapon.unarmed){
      if(handsLeft() < need) return;
      h.bag.splice(i,1); offs(h).push(nw);
    } else {
      h.bag.splice(i,1);
      const old = h.weapon; h.weapon = nw;
      if(old && !old.unarmed) h.bag.push(wCopy(old));
      const o = offs(h); while(handsUsed(h) > handsFree() && o.length) h.bag.push(wCopy(o.pop()));
    }
    state.ui.bagSel = null; persist(); render();
  },
  useItem(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    if(raceT("ogro") && /^Poção|^Pergaminho/.test(it.n)) return;
    if(/^Pergaminho/.test(it.n)) H().magic++;
    if(/^Poção de Vida/.test(it.n)) h.pv = h.pvMax;
    if(/^Poção de Magia/.test(it.n)) Object.values(h.spells).forEach(s=>s.left=s.max);
    if(/^Poção da Luminescência/.test(it.n)) h.torches = Math.min(10, h.torches+2);
    if(/^Poção da Salamandra/.test(it.n)) h.arms = Math.max(h.arms||2, raceStart(h).arms);
    if(/^Poção Mão na Roda/.test(it.n)){ h.arms = (h.arms||2) + 1; state.ui.armsMsg = `Um braço novo brota! Agora você tem ${h.arms} braços.`; }
    if(/^Poção da Salamandra/.test(it.n)) state.ui.armsMsg = `Seu corpo se regenera: você tem ${h.arms} braços.`;
    const sp = (it.n.match(/^Pergaminho Mágico \((.+)\)/)||[])[1];
    let msg = `Você usou ${it.n.split(" (")[0]}.`;
    if(sp === "Cura"){ const before = h.pv; h.pv = Math.min(h.pvMax, h.pv+5); msg = `Você leu o Pergaminho de Cura e recuperou ${h.pv-before} PV.`; }
    else if(sp === "Luz"){ h.torches = Math.min(10, h.torches+1); msg = "Você leu o Pergaminho de Luz: o globo vale como uma tocha."; }
    else if(sp === "Teletransporte"){ startTele("scroll", it.n); return; }
    else if(sp) return;
    if(/^Poção da Fúria/.test(it.n)) return;
    if(/^Vela dos Protetores/.test(it.n)){ h.velas = (h.velas||0) + 1; msg = `Você acendeu a Vela dos Protetores. ${velaTxt(h.velas)}.`; }
    if(/^Safira da Magia/.test(it.n)){ const s = SPELLS[d6()].n; h.spells[s] = h.spells[s] ? {max:h.spells[s].max+1, left:h.spells[s].left+1} : {max:1,left:1}; }
    h.bag.splice(i,1);
    if(state.dungeon && state.dungeon.inside) log(msg);
    state.ui.bagSel = null; persist(); render();
  },
  drop(b){ const h = state.hero; h.bag.splice(+b.dataset.i,1); state.ui.bagSel = null; persist(); render(); },

  async rollDungeon(){
    busy = true; lockButtons();
    if(!$("#t0")){ busy=false; return; }
    const r = await Promise.all([rollInto($("#t0"),1), rollInto($("#t1"),1), rollInto($("#t2"),1)]);
    const [a,bb,c] = r.map(x=>x[0]);
    state.dungeon = newDungeonRecord(a, dungeonName(a,bb,c), [a,bb,c]);
    state.ui = {};
    busy = false; persist(); render();
  },
  askReroll(){ state.ui.confirmReroll = true; render(); },
  cancelReroll(){ state.ui = {}; render(); },
  enter(){
    const d = state.dungeon, h = state.hero;
    if(mustRetire(h) && !d.inside){ go("city"); return; }
    if(!d.levels[1]){ buildLevel1(); log(`Você entrou n${d.name.startsWith("A ")?"a":"o"} ${d.name.slice(2)}.`); }
    else {
      d.pos = {level:1, seg:Object.values(d.levels[1].segs).find(s=>s.exit).id};
      Object.values(d.levels).forEach(lv=>Object.values(lv.segs).forEach(s=>{ if(s.mon) [s.mon,...(s.mon.extra||[])].forEach(g=>g.list.forEach(m=>m.pv=m.max)); }));
      log("Você voltou para a masmorra. Monstros que ficaram aqui recuperaram todos os PV, e as salas vazias podem ter novos ocupantes.");
    }
    d.visits++;
    d.inside = true;
    Object.values(d.levels).forEach(lv=>Object.values(lv.segs).forEach(s=>{ if(d.visits===1) s.ret = 1; }));
    state.ui = {}; rollLog = []; centerOn = true; mapVersion++;
    go("explore");
  },
  selDoor(b){ state.ui.selDoor = b.dataset.id; render(); },
  openDoor(b){ doOpenDoor(b.dataset.id); },
  unlock(b){ doUnlock(b.dataset.id, b.dataset.how); },
  loot(){ collectLoot(curSeg()); mapVersion++; persist(); render(); },
  chest(){ doChest(); },
  secret(){ doSecret(); },
  disarm(){ doDisarm(); },
  sneak(){ doSneak(); },
  defeat(){ doDefeat(); },
  descend(){ doDescend(); },
  climb(){ doClimb(); },
  corpse(){ doCorpse(); },
  lastFinal(){ const lv = LV(); const s = lv.segs[lv.last]; moveTo(s.id); doBoss(s); },
  leave(){ leaveDungeon(); state.ui = {}; persist(); render(); window.scrollTo(0,0); },
  zoom(b){ cam.z = clampZ(cam.z * +b.dataset.z); },
  center(){ centerOn = true; },
  noop(){},
  bagFilter(b){ const k = b.dataset.k; state.ui.bagFilter = state.ui.bagFilter === k ? null : k; state.ui.bagSel = null; render(); },
  sortBag(){ state.hero.bag.sort((a,b)=>a.n.localeCompare(b.n, "pt-BR", {sensitivity:"base"})); persist(); render(); },
  teleCancel(){ state.ui.tele = null; render(); },
  teleExit(){
    const d = D(), l1 = d.levels[1]; if(!l1) return;
    const ex = Object.values(l1.segs).find(s=>s.exit); if(!ex) return;
    teleTo(1, ex.id);
  },
  eqSel(b){ state.ui.eqSel = state.ui.eqSel === b.dataset.s ? null : b.dataset.s; state.ui.bagSel = null; render(); },
  unequip(b){
    const h = state.hero, s = b.dataset.s;
    if(h.bag.length >= bagMax()) return;
    if(s === "weapon"){ const w = h.weapon; h.bag.push(wCopy(w)); h.weapon = UNARMED(); }
    else if(/^off/.test(s)){ const o = offs(h), k = +s.slice(3); if(!o[k]) return; h.bag.push(wCopy(o[k])); o.splice(k,1); }
    else { h.bag.push(h.armor[s]); delete h.armor[s]; }
    state.ui.eqSel = null; persist(); render();
  },
  repairOne(b){
    const h = state.hero, p = h.armor[b.dataset.s]; if(!p) return;
    if(b.dataset.how === "coin"){ if(h.coins<1) return; h.coins--; }
    else { if(h.torches<1) return; if(state.dungeon && state.dungeon.inside){ if(!spendTorch(1, "Consertando a armadura")){ persist(); render(); return; } } else h.torches--; }
    p.cur = p.pv;
    if(state.dungeon && state.dungeon.inside) log(`Você consertou ${p.n.split(" (")[0]}.`);
    persist(); render();
  },
  fight(b){ startCombat(b.dataset.surprise === "1"); },
  target(b){ C().sel = +b.dataset.i; persist(); render(); },
  attack(b){
    const c = C(), h = state.hero; if(handsFree() === 0) return;
    let wn;
    if(c.chain && c.chain.length) wn = c.chain.shift();
    else {
      const d = b && b.dataset.w;
      wn = d === undefined || d === "m" ? "m" : +d;
      if(wn === "m" && attacksPerTurn() > 1) c.chain = offWeapons(h).map(x=>x.i).slice(0, attacksPerTurn()-1);
    }
    heroAttack("weapon", wn);
  },
  playDead(){ if(!raceT("zumbi")) return; cLog("Você se faz de morto... e escapa quando os monstros se distraem."); fleeCombat(); },
  horn(){ heroAttack("horn"); },
  cspell(b){ heroSpell(b.dataset.n); },
  citem(b){ heroItem(+b.dataset.i); },
  alloc(b){ const c = C(); const s = b.dataset.s; c.alloc[s] = Math.max(0, (c.alloc[s]||0) + +b.dataset.d); render(); },
  allocAll(){ const c = C(), h = state.hero; let left = c.pending.total; c.alloc = {};
    ARMOR_SLOTS.filter(s=>h.armor[s] && armorCur(h.armor[s])>0).sort((a,b)=>armorCur(h.armor[b])-armorCur(h.armor[a])).forEach(s=>{ const a = Math.min(left, armorCur(h.armor[s])); if(a){ c.alloc[s] = a; left -= a; } }); render(); },
  allocNone(){ C().alloc = {}; render(); },
  allocOk(){ const c = C(); applyHeroDamage(c.alloc, c.pending.total, c.pending.poison); },
  win(){ winCombat(); },
  async rechargePick(b){
    const c = C(), h = state.hero, rm = h.spells["Recarregar Mana"], n = b.dataset.n;
    if(!rm || rm.left<=0 || !h.spells[n]) return;
    c.recharge = false; rm.left--; H().magic++;
    h.spells[n].left = Math.min(h.spells[n].max, h.spells[n].left+1);
    busy = true; lockButtons(); cLog(`Recarregar Mana: ${n} recupera 1 uso.`);
    await afterHeroAction();
  },
  rechargeCancel(){ C().recharge = false; render(); },
  async stonePick(b){
    const c = C(), h = state.hero, sp = h.spells["Armadura de Pedra"], sl = b.dataset.s;
    if(!sp || sp.left<=0 || h.armor[sl]) return;
    c.stonePick = false; sp.left--; H().magic++; stoneArmor(sl);
    busy = true; lockButtons(); cLog(`Armadura de Pedra: você ganha ${sl} de Pedra (5 PV).`);
    await afterHeroAction();
  },
  stoneCancel(){ C().stonePick = false; render(); },
  stoneOut(b){
    const h = state.hero, sp = h.spells["Armadura de Pedra"], sl = b.dataset.s;
    if(!sp || sp.left<=0 || h.armor[sl]) return;
    sp.left--; H().magic++; stoneArmor(sl); state.ui.stonePick = false;
    log(`Armadura de Pedra: você ganha ${sl} de Pedra (5 PV).`);
    persist(); render();
  },
  stoneOutCancel(){ state.ui.stonePick = false; render(); },
  takeStash(){ takeStash(); persist(); render(); },
  later(){ state.ui.bagFull = false; log("Você deixou os itens aqui para pegar depois."); persist(); render(); },
  startPick(){
    const h = state.hero, seg = curSeg(), p = {};
    h.bag.forEach((_,i)=>p["b"+i] = true);
    let free = bagMax() - h.bag.length;
    seg.stash.forEach((_,i)=>{ p["s"+i] = free > 0; if(free>0) free--; });
    state.ui.pick = p; render();
  },
  togglePick(b){ state.ui.pick[b.dataset.k] = !state.ui.pick[b.dataset.k]; render(); },
  cancelPick(){ state.ui.pick = null; render(); },
  confirmPick(){
    const h = state.hero, seg = curSeg(), p = state.ui.pick;
    const keep = [], gone = [];
    h.bag.forEach((it,i)=>(p["b"+i] ? keep : gone).push(it));
    seg.stash.forEach((it,i)=>(p["s"+i] ? keep : gone).push(it));
    if(keep.length > bagMax()) return;
    h.bag = keep; seg.stash = [];
    state.ui.pick = null; state.ui.bagFull = false;
    log(gone.length ? `Você organizou a mochila e descartou: ${gone.map(it=>it.n.split(" (")[0]).join("; ")}.` : "Você organizou a mochila.");
    mapVersion++; persist(); render();
  },
  askDelGrave(b){ state.ui.delGrave = +b.dataset.i; render(); },
  cancelDelGrave(){ state.ui.delGrave = null; render(); },
  delGrave(b){ state.cemetery.splice(+b.dataset.i, 1); state.ui.delGrave = null; persist(); render(); },
  setSkin(b){
    const was = isZ();
    state.settings.skin = b.dataset.v;
    applySkin();
    if(was !== isZ()) cam.z = isZ() ? cam.z/4 : cam.z*4;
    cam.z = clampZ(cam.z); centerOn = true;
    persist(); render();
  },


  rest(){
    const h = state.hero, free = hasClass("Campeão"); if((h.coins<1 && !free) || !needRest(h)) return;
    if(!free) h.coins--; h.pv = h.pvMax; Object.values(h.spells).forEach(s=>s.left=s.max);
    state.ui.cityMsg = "Você descansou. PV e magias recuperados.";
    persist(); render();
  },
  buyTorch(){ const h = state.hero; if(h.coins<1||h.torches>=10) return; h.coins--; h.torches++; state.ui.cityMsg = "Você comprou 1 tocha."; persist(); render(); },
  repair(b){
    const h = state.hero, s = b && b.dataset.s || ARMOR_SLOTS.find(s=>h.armor[s] && armorCur(h.armor[s]) < h.armor[s].pv), p = s && h.armor[s];
    if(h.coins<1 || !p || armorCur(p) >= p.pv) return;
    const before = armorCur(p); h.coins--; p.cur = p.pv;
    state.ui.cityMsg = `${itemName(p)} consertado: ${before}/${p.pv} → ${p.pv}/${p.pv} PV.`;
    persist(); render();
  },
  buyShop(b){
    const h = state.hero, it = shopStock()[+b.dataset.i];
    if(!it || it.soon || it.sold || h.coins < it.price || h.bag.length >= bagMax()) return;
    h.coins -= it.price; it.sold = true; const {price, sold, ...item} = it; h.bag.push(fixWearable(item));
    state.ui.cityMsg = `Você comprou ${it.n.split(" (")[0]} por ${it.price} moedas.`;
    persist(); render();
  },
  brew(){ const h = state.hero; if(!hasClass("Alquimista") || h.coins<50 || h.bag.length>=bagMax()) return; h.coins -= 50; h.bag.push({n:"Poção de Vida (recupera todos os PV)"}); if(state.dungeon && state.dungeon.inside) log("Você preparou uma Poção de Vida."); persist(); render(); },
  fold(b){ const k = b.dataset.k; state.settings.fold = state.settings.fold || {}; state.settings.fold[k] = !state.settings.fold[k]; persist(); render(); },
  buyAdv(b){
    const h = state.hero, a = ADV_BY_NAME[b.dataset.n];
    if(!a || hasClass(a.n) || !advStatus(a,h).ok || h.coins < a.cost) return;
    h.coins -= a.cost; h.adv = (h.adv||[]).concat(a.n);
    h.pvMax += a.pv; h.pv += a.pv;
    if(a.loseCura) delete h.spells["Cura"];
    if(a.fixed) Object.entries(a.fixed).forEach(([n,q])=>{ const sp = h.spells[n] || {max:0,left:0}; sp.max += q; sp.left += q; h.spells[n] = sp; });
    const needs = []; (a.give||[]).forEach(([t,q])=>{ for(let i=0;i<q;i++) needs.push(t); });
    state.ui.advRoll = needs.length ? {cls:a.n, needs, got:[]} : null;
    state.ui.advMsg = `${h.name} agora é ${a.n}!${a.pv ? ` +${a.pv} PV.` : ""}`;
    persist(); render(); window.scrollTo(0,0);
  },
  async rollAdvSpell(){
    const ar = state.ui.advRoll, h = state.hero; if(!ar || ar.got.length >= ar.needs.length) return;
    busy = true; lockButtons();
    const t = ar.needs[ar.got.length], v = await rollInto($("#tray"), SPELL_TABLES[t].dice);
    const n = spellRollName(t, SPELL_TABLES[t].dice === 2 ? v[0]+v[1] : v[0]);
    ar.got.push(n);
    const sp = h.spells[n] || {max:0,left:0}; sp.max++; sp.left++; h.spells[n] = sp;
    busy = false; persist(); render();
  },
  advDone(){ state.ui.advRoll = null; persist(); render(); },
  lockItem(b){ const it = state.hero.bag[+b.dataset.i]; if(!it) return; it.locked = !it.locked; persist(); render(); },
  sell(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    if(!it || it.locked) return;
    const v = sellValue(it);
    h.coins += v; h.bag.splice(i,1); H(h).sold++;
    state.ui.cityMsg = `Você vendeu ${it.n.split(" (")[0]} por ${v} moeda${v===1?"":"s"}.`;
    persist(); render();
  },

  askDeath(){ state.ui.confirmDeath = true; render(); setTimeout(()=>{ const i=$("#deathCause"); if(i) i.focus(); },30); },
  cancelDeath(){ state.ui = {}; render(); },
  die(){
    const cause = ($("#deathCause").value||"").trim() || "Causa desconhecida";
    killHero(cause);
    persist(); render(); window.scrollTo(0,0);
  },
  copy(){
    const ta = $("#exportCode");
    const ok = () => { toastMsg = "Código copiado."; $("#toast").textContent = toastMsg; };
    const fallback = () => { ta.focus(); ta.select(); toastMsg = "Código selecionado. Toque em Copiar no menu do iPhone."; $("#toast").textContent = toastMsg; };
    try{ navigator.clipboard.writeText(ta.value).then(ok, fallback); }catch(e){ fallback(); }
  },
  async pasteSave(){
    const say = m => { toastMsg = m; $("#toast").textContent = m; };
    let txt = "";
    try{ txt = await navigator.clipboard.readText(); }
    catch(e){ say("O aparelho não liberou a área de transferência. Toque e segure no campo e escolha Colar."); return; }
    if(!txt || !txt.trim()){ say("A área de transferência está vazia. Copie o código primeiro."); return; }
    $("#importCode").value = txt.trim();
    try{ decodeSave(txt); say("Código colado. Confira e toque em Restaurar este save."); }
    catch(e){ say("O texto copiado não parece um save do NoteQuest. Confira se copiou o código inteiro."); }
  },
  import(){
    const code = $("#importCode").value;
    if(!code.trim()){ toastMsg = "Cole um código antes de restaurar."; $("#toast").textContent = toastMsg; return; }
    try{
      const s = decodeSave(code);
      state = {...freshState(), ...s, screen:"title", ui:{}};
      migrate(); applySkin(); persist(); toastMsg = ""; mapVersion++; render();
    }catch(e){
      toastMsg = "Esse código não é um save do NoteQuest. Confira se copiou ele inteiro, começando por NQ1:";
      $("#toast").textContent = toastMsg;
    }
  }
};
function startDraft(){
  state.draft = {step:"race", race:null, race2:null, raceCat:"comum", cls:null, raceDice:null, clsDice:null, spells:[], name:""};
  state.ui = {};
  go("create");
}
function lockButtons(){ document.querySelectorAll("#app button").forEach(b=>b.disabled = true); }

/* quantas tochas a ação gasta (para perguntar antes de usar a última) */
function torchCost(b){
  const h = state.hero, a = b.dataset.act, d = state.dungeon;
  if(!h || !d || !d.inside || state.screen === "combat") return 0;
  if(a === "openDoor" || a === "secret" || a === "disarm" || a === "sneak") return 1;
  if(a === "unlock" && b.dataset.how === "pick") return hasClass("Chaveiro") || hasClass("Ladrão") ? 0 : 1;
  if(a === "repairOne" && b.dataset.how === "torch") return 1;
  return 0;
}
let pendingTorch = null;
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(!b || busy || b.disabled) return;
  const h = state.hero, cost = torchCost(b);
  if(cost && h && h.torches > 0 && h.torches <= cost){
    pendingTorch = {act:b.dataset.act, data:{...b.dataset}};
    const box = document.createElement("div");
    box.className = "lastbox"; box.id = "lastbox";
    const luzSp = h.spells.Luz && h.spells.Luz.left > 0;
    const luzScroll = !raceT("ogro") && h.bag.some(it=>it.n === "Pergaminho Mágico (Luz)");
    box.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lastT"><h3 id="lastT">Última tocha</h3>
      <p>Esta ação usa a sua última tocha. ${luzSp || luzScroll ? "Você pode criar um globo de Luz e guardar a tocha." : raceT("fira") ? "Depois dela, você passa a gastar 2 PV no lugar de cada tocha." : hasClass("Minerador") ? "Sem tochas, só o Minerador acha a saída no escuro, e só se o caminho estiver livre. Se não estiver, o aventureiro morre." : "Sem tochas, a escuridão te devora e o aventureiro morre."}</p>
      <div class="stack">
        ${luzSp ? `<button class="btn" id="lastSpell">Usar a magia Luz <small>(${h.spells.Luz.left} uso${h.spells.Luz.left>1?"s":""})</small></button>` : ""}
        ${luzScroll ? `<button class="btn" id="lastScroll">Usar o Pergaminho de Luz</button>` : ""}
        <div class="row"><button class="btn ghost" id="lastNo">Cancelar</button><button class="btn ${luzSp||luzScroll?"ghost":""}" id="lastYes">Usar a última tocha</button></div>
      </div></div>`;
    document.body.appendChild(box);
    const close = () => { box.remove(); pendingTorch = null; };
    box.querySelector("#lastNo").onclick = close;
    box.addEventListener("click", ev=>{ if(ev.target === box) close(); });
    const run = () => { const p = pendingTorch; close(); const fn = actions[p.act]; if(fn) fn({dataset:p.data}); };
    box.querySelector("#lastYes").onclick = run;
    const bs = box.querySelector("#lastSpell");
    if(bs) bs.onclick = () => { h.spells.Luz.left--; h.torches++; H().magic++; log("Você conjurou Luz: o globo ilumina no lugar da tocha."); run(); };
    const bc = box.querySelector("#lastScroll");
    if(bc) bc.onclick = () => { const i = h.bag.findIndex(it=>it.n === "Pergaminho Mágico (Luz)"); if(i>=0){ h.bag.splice(i,1); h.torches++; H().magic++; log("Você leu o Pergaminho de Luz: o globo ilumina no lugar da tocha."); } run(); };
    return;
  }
  const fn = actions[b.dataset.act];
  if(fn) fn(b);
});
document.addEventListener("change", e=>{
  if(e.target.id==="bagCap"){ state.settings.bagCap = [10,20,0][+e.target.value]; persist(); render(); }
});
document.addEventListener("input", e=>{
  if(e.target.id==="bagCap"){ const v = [10,20,0][+e.target.value]; state.settings.bagCap = v; persist();
    document.querySelectorAll(".ticks span").forEach((sp,i)=>sp.classList.toggle("on", i===+e.target.value)); }
  if(e.target.id==="heroName" && state.draft){ state.draft.name = e.target.value; persist(); }
});

function paint(){
  document.querySelectorAll("canvas[data-anim]").forEach(cv=>{
    const a = cv.dataset.anim;
    if(a==="scene") drawScene(cv);
    if(a==="torches") drawTorches(cv);
    if(a==="map") drawMap(cv);
    if(a==="arena") drawArena(cv);
  });
  document.querySelectorAll("canvas[data-candle]").forEach(drawCandle);
  document.querySelectorAll("canvas[data-mon]").forEach(cv=>{
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#0c0a12"; ctx.fillRect(0,0,48,40);
    const P = state.dungeon ? palZ() : PALZ[6];
    for(let y=6;y<40;y++) for(let x=0;x<48;x++){ const h = zh(x,y); ctx.fillStyle = (x%32===0||y===6) ? P.F[0] : h<.14 ? P.F[1] : h>.86 ? P.F[3] : P.F[2]; ctx.fillRect(x,y,1,1); }
    if(cv.dataset.boss==="1"){ const g = ctx.createRadialGradient(24,26,2,24,26,20); g.addColorStop(0,"rgba(255,80,60,.22)"); g.addColorStop(1,"rgba(255,80,60,0)"); ctx.fillStyle = g; ctx.fillRect(0,0,48,40); }
    drawMonsterSprite(ctx, cv.dataset.mon, 24, 35, frame/8, frame);
  });
}
let last = 0;
function loop(ts){
  if(ts - last > 120){ last = ts; frame++; paint(); }
  else { const m = $("#map"); if(m) drawMap(m); const ar = $("#arena"); if(ar && fxPops.length) drawArena(ar); }
  requestAnimationFrame(loop);
}

function start(data){
  state = (data && data.state) ? data.state : loadState();
  migrate();
  applySkin();
  cam.z = isZ() ? .85 : 3;
  render();
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({state}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
